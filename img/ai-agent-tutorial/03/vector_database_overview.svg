<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="660" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">向量数据库在 RAG 里的作用</text>
    <text x="640" y="96" text-anchor="middle" font-size="20" fill="#64748b">保存资料向量，并快速找出和问题最相近的 chunk</text>

    <rect x="70" y="155" width="300" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="220" y="202" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">入库时</text>
    <rect x="110" y="245" width="220" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="220" y="281" text-anchor="middle" font-size="20" fill="#1e3a8a">chunk 原文</text>
    <rect x="110" y="330" width="220" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="220" y="366" text-anchor="middle" font-size="20" fill="#166534">chunk 向量</text>
    <rect x="110" y="415" width="220" height="58" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="220" y="451" text-anchor="middle" font-size="20" fill="#9a3412">来源标签</text>

    <line x1="390" y1="335" x2="510" y2="335" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="530" y="145" width="300" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="680" y="192" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">向量数据库</text>
    <text x="680" y="245" text-anchor="middle" font-size="20" fill="#334155">保存向量</text>
    <text x="680" y="290" text-anchor="middle" font-size="20" fill="#334155">建立索引</text>
    <text x="680" y="335" text-anchor="middle" font-size="20" fill="#334155">按相似度检索</text>
    <text x="680" y="380" text-anchor="middle" font-size="20" fill="#334155">返回原文 chunk</text>
    <rect x="575" y="430" width="210" height="54" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="680" y="464" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">不是普通全文搜索</text>

    <line x1="850" y1="335" x2="970" y2="335" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="990" y="155" width="220" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1100" y="202" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">提问时</text>
    <text x="1100" y="265" text-anchor="middle" font-size="20" fill="#334155">问题变向量</text>
    <text x="1100" y="320" text-anchor="middle" font-size="20" fill="#334155">查相近 chunk</text>
    <text x="1100" y="375" text-anchor="middle" font-size="20" fill="#334155">放进 Prompt</text>
    <text x="1100" y="430" text-anchor="middle" font-size="20" fill="#334155">生成回答</text>

    <rect x="170" y="575" width="940" height="45" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="640" y="604" text-anchor="middle" font-size="20" font-weight="700" fill="#155e75">核心：不是保存答案，而是帮助系统快速找到相关资料</text>
  </g>
</svg>
