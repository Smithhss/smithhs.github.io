<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="620" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">为什么需要 RAG</text>
    <text x="640" y="102" text-anchor="middle" font-size="20" fill="#64748b">大模型自己回答时，可能缺少最新资料和专属资料</text>

    <g filter="url(#shadow)">
      <rect x="80" y="180" width="300" height="220" rx="8" fill="#ffffff" stroke="#fecaca"/>
      <text x="230" y="225" text-anchor="middle" font-size="25" font-weight="700" fill="#b91c1c">直接问模型</text>
      <text x="230" y="270" text-anchor="middle" font-size="19" fill="#475569">可能不知道内部资料</text>
      <text x="230" y="310" text-anchor="middle" font-size="19" fill="#475569">可能知识过期</text>
      <text x="230" y="350" text-anchor="middle" font-size="19" fill="#475569">可能给出没有依据的回答</text>
    </g>

    <line x1="390" y1="290" x2="535" y2="290" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="550" y="160" width="180" height="260" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="640" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">RAG</text>
      <text x="640" y="260" text-anchor="middle" font-size="19" fill="#475569">先查资料</text>
      <text x="640" y="300" text-anchor="middle" font-size="19" fill="#475569">再组织回答</text>
      <text x="640" y="340" text-anchor="middle" font-size="19" fill="#475569">回答有依据</text>
    </g>

    <line x1="740" y1="290" x2="885" y2="290" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="900" y="180" width="300" height="220" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="1050" y="225" text-anchor="middle" font-size="25" font-weight="700" fill="#15803d">基于资料回答</text>
      <text x="1050" y="270" text-anchor="middle" font-size="19" fill="#475569">公司制度</text>
      <text x="1050" y="310" text-anchor="middle" font-size="19" fill="#475569">课程资料</text>
      <text x="1050" y="350" text-anchor="middle" font-size="19" fill="#475569">项目文档和业务规则</text>
    </g>

    <rect x="190" y="475" width="900" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="640" y="520" text-anchor="middle" font-size="23" font-weight="700" fill="#1e3a8a">RAG 的重点：不是让模型记住所有知识，而是让系统把正确资料交给模型</text>
  </g>
</svg>
