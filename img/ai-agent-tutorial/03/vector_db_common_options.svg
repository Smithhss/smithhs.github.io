<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="620" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">几个常见的向量数据库</text>
    <text x="640" y="96" text-anchor="middle" font-size="20" fill="#64748b">先知道名字和大致定位就够了</text>

    <rect x="90" y="160" width="250" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="215" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">Milvus</text>
    <text x="215" y="285" text-anchor="middle" font-size="20" fill="#334155">开源向量数据库</text>
    <text x="215" y="325" text-anchor="middle" font-size="20" fill="#334155">适合较大规模</text>
    <text x="215" y="365" text-anchor="middle" font-size="20" fill="#334155">向量检索</text>

    <rect x="375" y="160" width="250" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="500" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#15803d">Qdrant</text>
    <text x="500" y="285" text-anchor="middle" font-size="20" fill="#334155">开源向量数据库</text>
    <text x="500" y="325" text-anchor="middle" font-size="20" fill="#334155">使用体验较轻量</text>
    <text x="500" y="365" text-anchor="middle" font-size="20" fill="#334155">也适合项目落地</text>

    <rect x="660" y="160" width="250" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="785" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#c2410c">Chroma</text>
    <text x="785" y="285" text-anchor="middle" font-size="20" fill="#334155">轻量级向量库</text>
    <text x="785" y="325" text-anchor="middle" font-size="20" fill="#334155">常用于本地练习</text>
    <text x="785" y="365" text-anchor="middle" font-size="20" fill="#334155">和小 Demo</text>

    <rect x="945" y="160" width="250" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1070" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#7c3aed">pgvector</text>
    <text x="1070" y="285" text-anchor="middle" font-size="20" fill="#334155">PostgreSQL 扩展</text>
    <text x="1070" y="325" text-anchor="middle" font-size="20" fill="#334155">已有 PostgreSQL 时</text>
    <text x="1070" y="365" text-anchor="middle" font-size="20" fill="#334155">比较方便</text>

    <rect x="215" y="520" width="850" height="44" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="640" y="548" text-anchor="middle" font-size="20" font-weight="700" fill="#155e75">它们的核心目标相同：保存向量，并检索相似向量</text>
  </g>
</svg>
