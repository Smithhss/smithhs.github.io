<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">第三天学习路线：RAG 知识库问答</text>
  <text x="640" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#4b5563">让大模型先查资料，再基于资料回答</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g filter="url(#shadow)">
      <rect x="70" y="180" width="190" height="120" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="165" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">为什么需要 RAG</text>
      <text x="165" y="262" text-anchor="middle" font-size="18" fill="#475569">知识过期、幻觉</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="320" y="180" width="190" height="120" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="415" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#15803d">准备资料</text>
      <text x="415" y="262" text-anchor="middle" font-size="18" fill="#475569">加载、切分 Chunk</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="570" y="180" width="190" height="120" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="665" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#6d28d9">检索资料</text>
      <text x="665" y="262" text-anchor="middle" font-size="18" fill="#475569">关键词或向量搜索</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="820" y="180" width="190" height="120" rx="8" fill="#ffffff" stroke="#fed7aa"/>
      <text x="915" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">增强 Prompt</text>
      <text x="915" y="262" text-anchor="middle" font-size="18" fill="#475569">把资料放进上下文</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1070" y="180" width="150" height="120" rx="8" fill="#ffffff" stroke="#fecdd3"/>
      <text x="1145" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#be123c">生成回答</text>
      <text x="1145" y="262" text-anchor="middle" font-size="18" fill="#475569">引用资料回答</text>
    </g>

    <line x1="260" y1="240" x2="318" y2="240" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="510" y1="240" x2="568" y2="240" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="760" y1="240" x2="818" y2="240" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1010" y1="240" x2="1068" y2="240" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="130" y="400" width="1020" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="640" y="445" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">RAG 的一句话主线</text>
    <text x="640" y="500" text-anchor="middle" font-size="24" fill="#334155">用户问题 → 检索相关资料 → 拼接上下文 → 大模型基于资料回答</text>
    <text x="640" y="550" text-anchor="middle" font-size="20" fill="#64748b">重点不是让模型背下知识，而是让系统把正确资料交给模型</text>
  </g>
</svg>
