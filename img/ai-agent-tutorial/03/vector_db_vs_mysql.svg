<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="620" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">MySQL 和向量数据库解决的问题不同</text>
    <text x="640" y="96" text-anchor="middle" font-size="20" fill="#64748b">一个按字段精确查，一个按语义相似查</text>

    <rect x="100" y="150" width="480" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="340" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">MySQL</text>
    <text x="160" y="270" font-size="22" fill="#334155">适合查：</text>
    <text x="190" y="320" font-size="20" fill="#475569">course_id = 3</text>
    <text x="190" y="365" font-size="20" fill="#475569">status = PAID</text>
    <text x="190" y="410" font-size="20" fill="#475569">created_at &gt; 某个时间</text>
    <text x="340" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">按字段和条件查</text>

    <rect x="700" y="150" width="480" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="940" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#15803d">向量数据库</text>
    <text x="760" y="270" font-size="22" fill="#334155">适合查：</text>
    <text x="790" y="320" font-size="20" fill="#475569">和这个问题意思接近的资料</text>
    <text x="790" y="365" font-size="20" fill="#475569">最相似的 5 个 chunk</text>
    <text x="790" y="410" font-size="20" fill="#475569">语义相关的文档片段</text>
    <text x="940" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">按相似度查</text>

    <rect x="215" y="555" width="850" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="640" y="583" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">真实项目里经常一起用：业务数据放 MySQL，资料向量放向量数据库</text>
  </g>
</svg>
