<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="620" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">top_k：一次取回多少个 chunk</text>
    <text x="640" y="96" text-anchor="middle" font-size="20" fill="#64748b">太小容易漏资料，太大容易带入干扰</text>

    <rect x="80" y="150" width="330" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="245" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#dc2626">top_k 太小</text>
    <text x="245" y="265" text-anchor="middle" font-size="22" fill="#334155">只取 1 个 chunk</text>
    <text x="245" y="320" text-anchor="middle" font-size="20" fill="#475569">可能只拿到补课规则</text>
    <text x="245" y="360" text-anchor="middle" font-size="20" fill="#475569">漏掉作业规则</text>
    <rect x="135" y="410" width="220" height="44" rx="8" fill="#fee2e2" stroke="#fecaca"/>
    <text x="245" y="438" text-anchor="middle" font-size="19" font-weight="700" fill="#991b1b">答案不完整</text>

    <rect x="475" y="150" width="330" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="640" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#15803d">top_k 合适</text>
    <text x="640" y="265" text-anchor="middle" font-size="22" fill="#334155">取 3 到 8 个 chunk</text>
    <text x="640" y="320" text-anchor="middle" font-size="20" fill="#475569">相关资料基本拿到</text>
    <text x="640" y="360" text-anchor="middle" font-size="20" fill="#475569">无关内容可控</text>
    <rect x="530" y="410" width="220" height="44" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
    <text x="640" y="438" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">更容易回答稳</text>

    <rect x="870" y="150" width="330" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1035" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#c2410c">top_k 太大</text>
    <text x="1035" y="265" text-anchor="middle" font-size="22" fill="#334155">取 20 个 chunk</text>
    <text x="1035" y="320" text-anchor="middle" font-size="20" fill="#475569">请假、作业、退费</text>
    <text x="1035" y="360" text-anchor="middle" font-size="20" fill="#475569">考试、纪律都进来</text>
    <rect x="925" y="410" width="220" height="44" rx="8" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="1035" y="438" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">干扰变多</text>

    <rect x="215" y="545" width="850" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="640" y="573" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">top_k 的目标不是越大越好，而是够用且不乱</text>
  </g>
</svg>
