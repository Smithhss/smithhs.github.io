<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="620" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">向量的维度：一组用来描述文字的数字</text>
    <text x="640" y="96" text-anchor="middle" font-size="20" fill="#64748b">每个位置可以理解成一个“特征方向”，真实 Embedding 会有很多维</text>

    <rect x="70" y="145" width="500" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="320" y="192" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">一句话</text>
    <rect x="120" y="235" width="400" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="320" y="280" text-anchor="middle" font-size="22" fill="#1e3a8a">请假后怎么补课？</text>
    <text x="320" y="360" text-anchor="middle" font-size="22" fill="#475569">进入 Embedding 模型后</text>
    <text x="320" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">变成多维向量</text>

    <rect x="650" y="145" width="560" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="930" y="192" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">可以这样理解维度</text>

    <line x1="710" y1="245" x2="1150" y2="245" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="710" y1="305" x2="1150" y2="305" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="710" y1="365" x2="1150" y2="365" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="710" y1="425" x2="1150" y2="425" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="900" y1="220" x2="900" y2="455" stroke="#cbd5e1" stroke-width="2"/>

    <text x="760" y="232" font-size="20" font-weight="700" fill="#334155">维度</text>
    <text x="990" y="232" font-size="20" font-weight="700" fill="#334155">数值</text>

    <text x="750" y="282" font-size="20" fill="#334155">请假</text>
    <text x="990" y="282" font-size="21" font-weight="700" fill="#2563eb">0.82</text>
    <text x="750" y="342" font-size="20" fill="#334155">补课</text>
    <text x="990" y="342" font-size="21" font-weight="700" fill="#2563eb">0.91</text>
    <text x="750" y="402" font-size="20" fill="#334155">作业</text>
    <text x="990" y="402" font-size="21" font-weight="700" fill="#64748b">0.18</text>
    <text x="750" y="462" font-size="20" fill="#334155">退费</text>
    <text x="990" y="462" font-size="21" font-weight="700" fill="#64748b">0.05</text>

    <rect x="170" y="535" width="940" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="640" y="563" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">维度数量由 Embedding 模型决定，不是越多越好</text>
  </g>
</svg>
