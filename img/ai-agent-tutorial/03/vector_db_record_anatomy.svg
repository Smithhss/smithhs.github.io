<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="620" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">向量数据库里一条记录有什么</text>
    <text x="640" y="96" text-anchor="middle" font-size="20" fill="#64748b">不是只保存向量，还要能找到原文和来源</text>

    <rect x="100" y="150" width="330" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="265" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">vector</text>
    <text x="265" y="248" text-anchor="middle" font-size="20" fill="#334155">[0.12, 0.38, 0.77, ...]</text>
    <text x="265" y="315" text-anchor="middle" font-size="20" fill="#475569">用来做相似度检索</text>
    <text x="265" y="360" text-anchor="middle" font-size="20" fill="#475569">系统比较的是它</text>

    <rect x="475" y="150" width="330" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="640" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#15803d">content</text>
    <text x="640" y="255" text-anchor="middle" font-size="20" fill="#334155">学生请假后，</text>
    <text x="640" y="287" text-anchor="middle" font-size="20" fill="#334155">可以联系老师补课。</text>
    <text x="640" y="360" text-anchor="middle" font-size="20" fill="#475569">命中后放进 Prompt</text>
    <text x="640" y="405" text-anchor="middle" font-size="20" fill="#475569">大模型读的是它</text>

    <rect x="850" y="150" width="330" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1015" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">metadata</text>
    <text x="1015" y="250" text-anchor="middle" font-size="20" fill="#334155">来源文件</text>
    <text x="1015" y="285" text-anchor="middle" font-size="20" fill="#334155">章节 / 页码</text>
    <text x="1015" y="320" text-anchor="middle" font-size="20" fill="#334155">更新时间</text>
    <text x="1015" y="395" text-anchor="middle" font-size="20" fill="#475569">用来过滤和标注来源</text>

    <rect x="205" y="535" width="870" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="640" y="563" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">检索靠 vector，回答靠 content，可信度靠 metadata</text>
  </g>
</svg>
