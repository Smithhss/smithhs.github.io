<svg width="1280" height="680" viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="680" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="640" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">chunk_overlap 解决什么问题</text>
    <text x="640" y="100" text-anchor="middle" font-size="20" fill="#64748b">相邻 chunk 保留一小段重复内容，用来保护边界上下文</text>

    <text x="90" y="165" font-size="24" font-weight="700" fill="#334155">原文</text>
    <rect x="90" y="190" width="1100" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="640" y="234" text-anchor="middle" font-size="20" fill="#334155">学生请假后，如果需要补课，应在一周内联系授课老师。补课时间由老师根据班级进度统一安排。</text>

    <line x1="640" y1="270" x2="640" y2="320" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="90" y="355" font-size="24" font-weight="700" fill="#b91c1c">没有 overlap</text>
    <rect x="90" y="385" width="520" height="80" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="350" y="420" text-anchor="middle" font-size="19" fill="#7f1d1d">chunk 1：请假后需要补课</text>
    <text x="350" y="448" text-anchor="middle" font-size="19" fill="#7f1d1d">应在一周内联系授课老师</text>
    <rect x="670" y="385" width="520" height="80" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="930" y="420" text-anchor="middle" font-size="19" fill="#7f1d1d">chunk 2：补课时间</text>
    <text x="930" y="448" text-anchor="middle" font-size="19" fill="#7f1d1d">由老师根据班级进度统一安排</text>

    <text x="90" y="530" font-size="24" font-weight="700" fill="#15803d">加入 overlap</text>
    <rect x="90" y="560" width="520" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="350" y="595" text-anchor="middle" font-size="19" fill="#14532d">chunk 1：请假后需要补课</text>
    <text x="350" y="623" text-anchor="middle" font-size="19" fill="#14532d">应在一周内联系授课老师</text>
    <rect x="670" y="560" width="520" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="930" y="595" text-anchor="middle" font-size="19" fill="#14532d">chunk 2：应在一周内联系授课老师</text>
    <text x="930" y="623" text-anchor="middle" font-size="19" fill="#14532d">补课时间由老师根据进度安排</text>
  </g>
</svg>
