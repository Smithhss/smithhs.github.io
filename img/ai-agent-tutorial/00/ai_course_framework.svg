<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f8fb"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#1f2937">大模型应用开发能力框架</text>
  <text x="600" y="98" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">从调用模型，到构建能检索、能记忆、能执行任务的 AI 应用</text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="110" y="150" width="980" height="74" rx="14" fill="#e8f4ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="180" font-size="22" font-weight="700" fill="#0f3b66">第五层：Agent 执行层</text>
    <text x="150" y="210" font-size="17" fill="#334155">任务规划、工具调用、ReAct、Function Calling、MCP、多步骤流程、执行安全</text>

    <rect x="150" y="250" width="900" height="74" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="190" y="280" font-size="22" font-weight="700" fill="#065f46">第四层：知识增强层</text>
    <text x="190" y="310" font-size="17" fill="#334155">Embedding、向量数据库、RAG、检索、重排序、知识库问答</text>

    <rect x="190" y="350" width="820" height="74" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="230" y="380" font-size="22" font-weight="700" fill="#9a3412">第三层：上下文与记忆层</text>
    <text x="230" y="410" font-size="17" fill="#334155">对话历史、Session、短期记忆、长期记忆、摘要压缩、用户画像</text>

    <rect x="230" y="450" width="740" height="74" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="270" y="480" font-size="22" font-weight="700" fill="#991b1b">第二层：Prompt 控制层</text>
    <text x="270" y="510" font-size="17" fill="#334155">角色设定、任务拆解、格式约束、Few-shot、结构化输出</text>

    <rect x="270" y="550" width="660" height="74" rx="14" fill="#f3e8ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="310" y="580" font-size="22" font-weight="700" fill="#581c87">第一层：模型调用层</text>
    <text x="310" y="610" font-size="17" fill="#334155">API、模型参数、流式输出、异常处理、成本控制、部署接入</text>
  </g>

  <path d="M600 638 L600 675" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 675 L584 658 M600 675 L616 658" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="700" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">每一层都是 Agent 应用的组成零件</text>
</svg>
