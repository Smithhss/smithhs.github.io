<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#1f2937">AI 发展历程：从规则系统到 Agent</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">理解历史，才能理解为什么今天的大模型应用开发会成为主线</text>

  <defs>
    <marker id="arrow-history" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <path d="M90 360 H1110" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <circle cx="145" cy="360" r="36" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="145" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">1</text>
    <text x="145" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">规则 AI</text>
    <text x="145" y="276" text-anchor="middle" font-size="15" fill="#475569">1950s-1980s</text>
    <text x="145" y="421" text-anchor="middle" font-size="15" fill="#334155">专家系统</text>
    <text x="145" y="446" text-anchor="middle" font-size="15" fill="#334155">人写规则</text>

    <circle cx="315" cy="360" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="315" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#4c1d95">2</text>
    <text x="315" y="421" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">机器学习</text>
    <text x="315" y="452" text-anchor="middle" font-size="15" fill="#475569">1990s-2010s</text>
    <text x="315" y="245" text-anchor="middle" font-size="15" fill="#334155">从数据中学习</text>
    <text x="315" y="270" text-anchor="middle" font-size="15" fill="#334155">分类 / 预测 / 推荐</text>

    <circle cx="485" cy="360" r="36" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="485" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">3</text>
    <text x="485" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">深度学习</text>
    <text x="485" y="276" text-anchor="middle" font-size="15" fill="#475569">2012 起</text>
    <text x="485" y="421" text-anchor="middle" font-size="15" fill="#334155">CNN / RNN / LSTM</text>
    <text x="485" y="446" text-anchor="middle" font-size="15" fill="#334155">图像 / 语音 / 翻译</text>

    <circle cx="655" cy="360" r="36" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <text x="655" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">4</text>
    <text x="655" y="421" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Transformer</text>
    <text x="655" y="452" text-anchor="middle" font-size="15" fill="#475569">2017 起</text>
    <text x="655" y="245" text-anchor="middle" font-size="15" fill="#334155">Attention 机制</text>
    <text x="655" y="270" text-anchor="middle" font-size="15" fill="#334155">BERT / GPT / T5</text>

    <circle cx="825" cy="360" r="36" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="825" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">5</text>
    <text x="825" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">大语言模型</text>
    <text x="825" y="276" text-anchor="middle" font-size="15" fill="#475569">2018-2022</text>
    <text x="825" y="421" text-anchor="middle" font-size="15" fill="#334155">ChatGPT / Copilot</text>
    <text x="825" y="446" text-anchor="middle" font-size="15" fill="#334155">生成式 AI 普及</text>

    <circle cx="995" cy="360" r="36" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/>
    <text x="995" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#155e75">6</text>
    <text x="995" y="421" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">AI 应用与 Agent</text>
    <text x="995" y="452" text-anchor="middle" font-size="15" fill="#475569">2023 起</text>
    <text x="995" y="245" text-anchor="middle" font-size="15" fill="#334155">RAG / Tools / Memory</text>
    <text x="995" y="270" text-anchor="middle" font-size="15" fill="#334155">从回答走向执行</text>
  </g>

  <path d="M185 360 H267" stroke="#334155" stroke-width="3" marker-end="url(#arrow-history)"/>
  <path d="M355 360 H437" stroke="#334155" stroke-width="3" marker-end="url(#arrow-history)"/>
  <path d="M525 360 H607" stroke="#334155" stroke-width="3" marker-end="url(#arrow-history)"/>
  <path d="M695 360 H777" stroke="#334155" stroke-width="3" marker-end="url(#arrow-history)"/>
  <path d="M865 360 H947" stroke="#334155" stroke-width="3" marker-end="url(#arrow-history)"/>

  <rect x="170" y="560" width="860" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="590" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#1f2937">关键变化</text>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#475569">AI 从“人写规则”走向“模型学习”，再走向“模型参与任务执行”</text>
</svg>
