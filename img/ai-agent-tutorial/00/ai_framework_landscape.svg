<svg width="1180" height="560" viewBox="0 0 1180 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1180" height="560" rx="24" fill="#F8FAFC"/>
  <text x="590" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#172033">常见 AI 应用开发框架位置</text>
  <text x="590" y="94" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#64748B">前言先建立方位感，后续课程再结合项目深入</text>

  <defs>
    <marker id="framework-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="#475569"/>
    </marker>
    <filter id="framework-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#framework-shadow)">
    <rect x="70" y="176" width="190" height="160" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="165" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700" fill="#172033">模型层</text>
    <rect x="104" y="252" width="122" height="34" rx="9" fill="#DBEAFE"/>
    <text x="165" y="275" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#1D4ED8">云端 API</text>
    <rect x="104" y="298" width="122" height="34" rx="9" fill="#E0F2FE"/>
    <text x="165" y="321" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#0E7490">Ollama</text>

    <rect x="320" y="144" width="230" height="224" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="435" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#172033">应用编排层</text>
    <rect x="356" y="222" width="158" height="38" rx="10" fill="#FEF3C7"/>
    <text x="435" y="247" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#B45309">LangChain</text>
    <rect x="356" y="276" width="158" height="38" rx="10" fill="#F3E8FF"/>
    <text x="435" y="301" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#6D28D9">LangGraph</text>
    <text x="435" y="344" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#64748B">组织调用链和 Agent 流程</text>

    <rect x="610" y="144" width="230" height="224" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="725" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#172033">知识与数据层</text>
    <rect x="646" y="222" width="158" height="38" rx="10" fill="#DCFCE7"/>
    <text x="725" y="247" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#15803D">LlamaIndex</text>
    <rect x="646" y="276" width="158" height="38" rx="10" fill="#ECFDF5"/>
    <text x="725" y="301" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#166534">向量数据库</text>
    <text x="725" y="344" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#64748B">文档索引、检索和知识库问答</text>

    <rect x="900" y="144" width="210" height="224" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1005" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#172033">工具执行层</text>
    <rect x="940" y="222" width="130" height="38" rx="10" fill="#FCE7F3"/>
    <text x="1005" y="247" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#BE185D">MCP</text>
    <rect x="940" y="276" width="130" height="38" rx="10" fill="#FFE4E6"/>
    <text x="1005" y="301" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#BE123C">OpenClaw</text>
    <text x="1005" y="344" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#64748B">连接业务工具并执行任务</text>
  </g>

  <line x1="260" y1="256" x2="313" y2="256" stroke="#475569" stroke-width="4" marker-end="url(#framework-arrow)"/>
  <line x1="550" y1="256" x2="603" y2="256" stroke="#475569" stroke-width="4" marker-end="url(#framework-arrow)"/>
  <line x1="840" y1="256" x2="893" y2="256" stroke="#475569" stroke-width="4" marker-end="url(#framework-arrow)"/>

  <rect x="190" y="430" width="800" height="58" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="590" y="466" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#334155">理解方式：模型提供能力，框架组织流程，RAG 接资料，MCP 接工具，Agent 完成任务</text>
</svg>
