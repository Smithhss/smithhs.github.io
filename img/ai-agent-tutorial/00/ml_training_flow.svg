<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#1f2937">机器学习是怎么“学习”的</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">用大量样本训练模型，让模型学会输入和结果之间的规律</text>

  <defs>
    <marker id="arrow-ml-flow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="80" y="170" width="160" height="100" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="160" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">样本数据</text>
    <text x="160" y="242" text-anchor="middle" font-size="16" fill="#334155">邮件、订单、用户行为</text>

    <rect x="305" y="170" width="160" height="100" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="385" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">标签答案</text>
    <text x="385" y="242" text-anchor="middle" font-size="16" fill="#334155">垃圾/正常、风险高/低</text>

    <rect x="530" y="170" width="160" height="100" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="610" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#c2410c">训练模型</text>
    <text x="610" y="242" text-anchor="middle" font-size="16" fill="#334155">不断调整内部参数</text>

    <rect x="755" y="170" width="160" height="100" rx="16" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <text x="835" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#be185d">形成规律</text>
    <text x="835" y="242" text-anchor="middle" font-size="16" fill="#334155">学到判断模式</text>

    <rect x="980" y="170" width="160" height="100" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="1060" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">预测新数据</text>
    <text x="1060" y="242" text-anchor="middle" font-size="16" fill="#334155">给新样本一个结果</text>

    <path d="M245 220 H295" stroke="#475569" stroke-width="3" marker-end="url(#arrow-ml-flow)"/>
    <path d="M470 220 H520" stroke="#475569" stroke-width="3" marker-end="url(#arrow-ml-flow)"/>
    <path d="M695 220 H745" stroke="#475569" stroke-width="3" marker-end="url(#arrow-ml-flow)"/>
    <path d="M920 220 H970" stroke="#475569" stroke-width="3" marker-end="url(#arrow-ml-flow)"/>

    <rect x="170" y="350" width="860" height="78" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="382" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">核心区别</text>
    <text x="600" y="414" text-anchor="middle" font-size="17" fill="#475569">规则 AI 是人写判断逻辑；机器学习是人准备数据，让模型从数据里学判断逻辑。</text>
  </g>
</svg>
