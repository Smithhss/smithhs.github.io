<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fbfbf8"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#1f2937">Agent 应用的基本工作框架</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">理解目标 → 拆解任务 → 调用工具 → 观察结果 → 持续决策</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="80" y="305" width="160" height="92" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#075985">用户目标</text>
    <text x="160" y="370" text-anchor="middle" font-size="16" fill="#334155">一句自然语言需求</text>

    <rect x="310" y="170" width="260" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="440" y="214" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Agent 大脑</text>
    <rect x="348" y="245" width="184" height="54" rx="10" fill="#fef3c7"/>
    <text x="440" y="279" text-anchor="middle" font-size="18" fill="#78350f">任务理解</text>
    <rect x="348" y="318" width="184" height="54" rx="10" fill="#dcfce7"/>
    <text x="440" y="352" text-anchor="middle" font-size="18" fill="#14532d">任务拆解</text>
    <rect x="348" y="391" width="184" height="54" rx="10" fill="#fee2e2"/>
    <text x="440" y="425" text-anchor="middle" font-size="18" fill="#7f1d1d">下一步决策</text>
    <rect x="348" y="464" width="184" height="54" rx="10" fill="#ede9fe"/>
    <text x="440" y="498" text-anchor="middle" font-size="18" fill="#4c1d95">结果校验</text>

    <rect x="675" y="126" width="180" height="74" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="765" y="157" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">工具 Tools</text>
    <text x="765" y="183" text-anchor="middle" font-size="15" fill="#334155">API / 数据库 / 代码</text>

    <rect x="675" y="245" width="180" height="74" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="765" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">知识库 RAG</text>
    <text x="765" y="302" text-anchor="middle" font-size="15" fill="#334155">文档 / 向量 / 检索</text>

    <rect x="675" y="364" width="180" height="74" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="765" y="395" text-anchor="middle" font-size="21" font-weight="700" fill="#c2410c">记忆 Memory</text>
    <text x="765" y="421" text-anchor="middle" font-size="15" fill="#334155">历史 / 偏好 / 状态</text>

    <rect x="675" y="483" width="180" height="74" rx="14" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <text x="765" y="514" text-anchor="middle" font-size="21" font-weight="700" fill="#be185d">安全边界</text>
    <text x="765" y="540" text-anchor="middle" font-size="15" fill="#334155">权限 / 审计 / 限制</text>

    <rect x="960" y="305" width="160" height="92" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="1040" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">任务结果</text>
    <text x="1040" y="370" text-anchor="middle" font-size="16" fill="#334155">回答或执行完成</text>
  </g>

  <path d="M240 351 L300 351" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M570 351 L660 164" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M570 351 L660 282" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M570 351 L660 401" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M570 351 L660 520" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M855 351 L950 351" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M765 200 C600 230 600 470 765 483" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="600" y="630" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">Agent 不是单个提示词，而是一套“模型 + 工具 + 记忆 + 知识 + 安全”的工程系统</text>
</svg>
