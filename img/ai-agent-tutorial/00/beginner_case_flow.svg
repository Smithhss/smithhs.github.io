<svg width="1180" height="540" viewBox="0 0 1180 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1180" height="540" rx="24" fill="#F8FAFC"/>
  <text x="590" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#172033">从聊天助手到 Agent 助手</text>
  <text x="590" y="94" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#64748B">同一个企业资料问答场景，逐步增加能力</text>

  <defs>
    <marker id="arrow-case" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="#475569"/>
    </marker>
    <filter id="shadow-case" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow-case)">
    <rect x="70" y="145" width="280" height="250" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="96" y="172" width="228" height="52" rx="12" fill="#DBEAFE"/>
    <text x="210" y="206" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#1D4ED8">版本 1：会聊天</text>
    <text x="116" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">用户问：</text>
    <text x="116" y="296" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#64748B">“请假制度是什么？”</text>
    <text x="116" y="342" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">AI 直接回答</text>
    <text x="116" y="372" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">可能不知道公司内部制度</text>

    <rect x="450" y="145" width="280" height="250" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="476" y="172" width="228" height="52" rx="12" fill="#DCFCE7"/>
    <text x="590" y="206" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#15803D">版本 2：会查资料</text>
    <text x="496" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">用户问同样问题</text>
    <text x="496" y="306" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">系统先检索制度文档</text>
    <text x="496" y="346" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">AI 基于资料回答</text>
    <text x="496" y="376" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">这就是 RAG 的作用</text>

    <rect x="830" y="145" width="280" height="250" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="856" y="172" width="228" height="52" rx="12" fill="#FCE7F3"/>
    <text x="970" y="206" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#BE185D">版本 3：会办事</text>
    <text x="876" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">判断是否符合规则</text>
    <text x="876" y="306" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">查询员工剩余额度</text>
    <text x="876" y="346" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#334155">生成请假申请</text>
    <text x="876" y="376" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">这就是 Agent 的方向</text>
  </g>

  <line x1="350" y1="270" x2="443" y2="270" stroke="#475569" stroke-width="4" marker-end="url(#arrow-case)"/>
  <line x1="730" y1="270" x2="823" y2="270" stroke="#475569" stroke-width="4" marker-end="url(#arrow-case)"/>

  <rect x="190" y="438" width="800" height="58" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="590" y="474" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#334155">课程就是沿着这条路线，把一个简单 AI 程序逐步做成可用应用</text>
</svg>
