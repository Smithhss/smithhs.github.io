    <text x="920" y="285" text-anchor="middle" font-size="15" fill="#64748b">国内 API</text>
    <text x="920" y="308" text-anchor="middle" font-size="15" fill="#64748b">应用接入</text>

    <rect x="1030" y="140" width="115" height="180" rx="16" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
