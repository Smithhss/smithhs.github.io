    <text x="1088" y="215" text-anchor="middle" font-size="15" fill="#334155">DeepSeek</text>
    <text x="1088" y="242" text-anchor="middle" font-size="15" fill="#334155">Kimi</text>
    <text x="1088" y="269" text-anchor="middle" font-size="15" fill="#334155">智谱等</text>
    <text x="1088" y="305" text-anchor="middle" font-size="14" fill="#64748b">推理 长文档</text>

    <rect x="160" y="405" width="880" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="438" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">学习重点</text>
    <text x="600" y="470" text-anchor="middle" font-size="17" fill="#475569">不是记住某个模型版本，而是掌握模型选择、API 调用、Prompt、RAG、Agent 和工程落地方法。</text>
