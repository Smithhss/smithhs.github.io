<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#1f2937">常见大模型与工具生态</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">模型名称会持续变化，课程重点是理解不同产品的定位和使用场景</text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="55" y="140" width="170" height="180" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="140" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#4338ca">OpenAI</text>
    <text x="140" y="215" text-anchor="middle" font-size="16" fill="#334155">GPT / ChatGPT</text>
    <text x="140" y="242" text-anchor="middle" font-size="16" fill="#334155">Codex</text>
    <text x="140" y="285" text-anchor="middle" font-size="15" fill="#64748b">通用对话</text>
    <text x="140" y="308" text-anchor="middle" font-size="15" fill="#64748b">代码与 Agent</text>

    <rect x="250" y="140" width="170" height="180" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="335" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#c2410c">Anthropic</text>
    <text x="335" y="215" text-anchor="middle" font-size="16" fill="#334155">Claude</text>
    <text x="335" y="242" text-anchor="middle" font-size="16" fill="#334155">Claude Code</text>
    <text x="335" y="285" text-anchor="middle" font-size="15" fill="#64748b">长文档</text>
    <text x="335" y="308" text-anchor="middle" font-size="15" fill="#64748b">代码协作</text>

    <rect x="445" y="140" width="170" height="180" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="530" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#0e7490">Google</text>
    <text x="530" y="215" text-anchor="middle" font-size="16" fill="#334155">Gemini</text>
    <text x="530" y="242" text-anchor="middle" font-size="16" fill="#334155">多模态 / 长上下文</text>
    <text x="530" y="285" text-anchor="middle" font-size="15" fill="#64748b">文本 图像 音频</text>
    <text x="530" y="308" text-anchor="middle" font-size="15" fill="#64748b">搜索和生态集成</text>

    <rect x="640" y="140" width="170" height="180" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="725" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#15803d">阿里</text>
    <text x="725" y="215" text-anchor="middle" font-size="16" fill="#334155">通义千问 / Qwen</text>
    <text x="725" y="242" text-anchor="middle" font-size="16" fill="#334155">开源模型生态</text>
    <text x="725" y="285" text-anchor="middle" font-size="15" fill="#64748b">中文 场景落地</text>
    <text x="725" y="308" text-anchor="middle" font-size="15" fill="#64748b">代码 多模态</text>

    <rect x="835" y="140" width="170" height="180" rx="16" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <text x="920" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#be185d">字节</text>
    <text x="920" y="215" text-anchor="middle" font-size="16" fill="#334155">豆包 / Doubao</text>
