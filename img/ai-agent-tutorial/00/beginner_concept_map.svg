<svg width="1180" height="560" viewBox="0 0 1180 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1180" height="560" rx="24" fill="#F8FAFC"/>
  <text x="590" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#172033">零基础先看这 5 个概念</text>
  <text x="590" y="94" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#64748B">从“会回答”到“能办事”的 AI 应用开发路线</text>

  <defs>
    <marker id="arrow-beginner" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="#475569"/>
    </marker>
    <filter id="shadow-beginner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow-beginner)">
    <rect x="54" y="176" width="180" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="144" cy="214" r="23" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
    <text x="144" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">1</text>
    <text x="144" y="262" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#172033">大模型</text>
    <text x="144" y="292" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">已经训练好的</text>
    <text x="144" y="316" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">AI 大脑</text>

    <rect x="282" y="176" width="180" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="372" cy="214" r="23" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
    <text x="372" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#B45309">2</text>
    <text x="372" y="262" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#172033">Prompt</text>
    <text x="372" y="292" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">告诉 AI</text>
    <text x="372" y="316" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">怎么做、怎么答</text>

    <rect x="510" y="176" width="180" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="600" cy="214" r="23" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/>
    <text x="600" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#15803D">3</text>
    <text x="600" y="262" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#172033">RAG</text>
    <text x="600" y="292" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">先查资料</text>
    <text x="600" y="316" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">再回答</text>

    <rect x="738" y="176" width="180" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="828" cy="214" r="23" fill="#E0F2FE" stroke="#06B6D4" stroke-width="3"/>
    <text x="828" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#0E7490">4</text>
    <text x="828" y="262" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#172033">Tools</text>
    <text x="828" y="292" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">连接系统</text>
    <text x="828" y="316" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">调用工具</text>

    <rect x="966" y="176" width="180" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="1056" cy="214" r="23" fill="#FCE7F3" stroke="#EC4899" stroke-width="3"/>
    <text x="1056" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#BE185D">5</text>
    <text x="1056" y="262" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#172033">Agent</text>
    <text x="1056" y="292" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">拆任务</text>
    <text x="1056" y="316" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#64748B">执行流程</text>
  </g>

  <line x1="234" y1="251" x2="275" y2="251" stroke="#475569" stroke-width="4" marker-end="url(#arrow-beginner)"/>
  <line x1="462" y1="251" x2="503" y2="251" stroke="#475569" stroke-width="4" marker-end="url(#arrow-beginner)"/>
  <line x1="690" y1="251" x2="731" y2="251" stroke="#475569" stroke-width="4" marker-end="url(#arrow-beginner)"/>
  <line x1="918" y1="251" x2="959" y2="251" stroke="#475569" stroke-width="4" marker-end="url(#arrow-beginner)"/>

  <rect x="170" y="408" width="840" height="68" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="590" y="436" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#334155">学习顺序：先会调用模型，再让模型查资料、用工具、完成任务</text>
  <text x="590" y="464" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#64748B">不要先背名词，先理解每个能力解决什么问题</text>
</svg>
