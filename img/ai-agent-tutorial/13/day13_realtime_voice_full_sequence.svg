<svg width="1440" height="2380" viewBox="0 0 1440 2380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">模拟面试实时语音完整时序图</title>
  <desc id="desc">前端、Java 后端、火山 Realtime 三方之间，从启动语音面试到上传音频、提交回答、接收文本和 PCM 音频的完整时序。</desc>
  <defs>
    <pattern id="dotGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.1" fill="#c4cad3"/>
    </pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#141a24"/>
    </marker>
    <marker id="arrowReturn" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M12,2 L2,7 L12,12 Z" fill="#141a24"/>
    </marker>
    <style>
      .bg{fill:#fbfcff}
      .laneLine{stroke:#111827;stroke-width:2.6;stroke-dasharray:6 8}
      .headBox{fill:#f2f5fb;stroke:#111827;stroke-width:2.5}
      .headText{font:700 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937;text-anchor:middle}
      .note{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}
      .noteText{font:15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#7c2d12}
      .active{fill:#dfe7ff;stroke:#111827;stroke-width:2}
      .activeStrong{fill:#dbeafe;stroke:#2563eb;stroke-width:3}
      .arrow{stroke:#141a24;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .return{stroke:#141a24;stroke-width:2.5;fill:none;marker-start:url(#arrowReturn)}
      .self{stroke:#141a24;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .label{font:17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467;text-anchor:middle}
      .tiny{font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .section{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sectionLine{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:8 8}
      .phase{fill:#eef6ff;stroke:#bfdbfe;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1440" height="2380" class="bg"/>
  <rect width="1440" height="2380" fill="url(#dotGrid)" opacity="0.9"/>

  <text x="72" y="54" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#111827">模拟面试实时语音：完整时序图</text>
  <text x="72" y="88" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#667085">看懂这张图，就能看懂为什么要有 voiceSessionId，以及 Java 为什么要同时管理两条 WebSocket。</text>

  <line x1="120" y1="150" x2="120" y2="2336" class="laneLine"/>
  <line x1="720" y1="150" x2="720" y2="2336" class="laneLine"/>
  <line x1="1300" y1="150" x2="1300" y2="2336" class="laneLine"/>

  <rect x="42" y="74" width="156" height="70" rx="8" class="headBox"/>
  <text x="120" y="116" class="headText">前端</text>

  <rect x="642" y="74" width="156" height="70" rx="8" class="headBox"/>
  <text x="720" y="116" class="headText">Java 后端</text>

  <rect x="1222" y="74" width="156" height="70" rx="8" class="headBox"/>
  <text x="1300" y="116" class="headText">火山 Realtime</text>

  <rect x="84" y="220" width="40" height="112" rx="6" class="active"/>
  <rect x="700" y="220" width="40" height="124" rx="6" class="active"/>
  <path d="M148 266 H690" class="arrow"/>
  <text x="420" y="249" class="label">HTTP 发起模拟面试语音</text>
  <text x="420" y="279" class="small">POST /student/mock-interview/sessions/{sessionId}/voice/start</text>

  <rect x="760" y="246" width="290" height="78" rx="10" class="note"/>
  <text x="778" y="278" class="noteText">Java 先生成 voiceSessionId</text>
  <text x="778" y="304" class="noteText">它是前端 WS 和火山 WS 的配对钥匙</text>

  <rect x="700" y="386" width="40" height="332" rx="6" class="activeStrong"/>
  <rect x="1280" y="386" width="40" height="150" rx="6" class="active"/>
  <path d="M742 442 H1274" class="arrow"/>
  <text x="1008" y="424" class="label">申请建立火山 WebSocket</text>
  <text x="1008" y="454" class="small">带 X-Api-App-ID / Access-Key / Resource-Id 等请求头</text>

  <path d="M1278 514 H742" class="return"/>
  <text x="1008" y="497" class="label">WebSocket 握手成功</text>

  <path d="M742 584 H1274" class="arrow"/>
  <text x="1008" y="566" class="label">发送 StartConnection</text>
  <text x="1008" y="596" class="small">event=1，告诉火山：我要开始一条实时连接</text>

  <path d="M1278 654 H742" class="return"/>
  <text x="1008" y="637" class="label">返回 StartedConnection</text>
  <text x="1008" y="667" class="small">event=50，Java 的 connectionReady 完成</text>

  <path d="M742 724 H1274" class="arrow"/>
  <text x="1008" y="706" class="label">发送 StartSession</text>
  <text x="1008" y="736" class="small">带面试官 prompt、ASR 输入 16k PCM、TTS 输出 24k PCM</text>

  <rect x="1280" y="688" width="40" height="108" rx="6" class="active"/>
  <path d="M1278 784 H742" class="return"/>
  <text x="1008" y="767" class="label">返回 StartedSession</text>
  <text x="1008" y="797" class="small">event=150，Java 的 sessionReady 完成</text>

  <path d="M692 862 H148" class="return"/>
  <text x="420" y="844" class="label">返回模拟面试 voiceSessionId</text>
  <text x="420" y="874" class="small">前端拿到它，下一步才知道要连哪一条 Java 语音通道</text>

  <line x1="58" y1="930" x2="1382" y2="930" class="sectionLine"/>
  <rect x="72" y="906" width="250" height="46" rx="23" class="phase"/>
  <text x="94" y="935" class="section">第二步：前端接入 Java WebSocket</text>

  <rect x="84" y="990" width="40" height="138" rx="6" class="active"/>
  <rect x="700" y="990" width="40" height="210" rx="6" class="active"/>
  <path d="M148 1048 H690" class="arrow"/>
  <text x="420" y="1030" class="label">建立前端 WebSocket</text>
  <text x="420" y="1060" class="small">URL 携带 token、sessionId、voiceSessionId</text>

  <path d="M760 1100 C620 1100 620 1160 700 1160" class="self"/>
  <text x="522" y="1128" class="label">握手校验</text>
  <text x="522" y="1158" class="small">确认学生 token 和面试 session 属于当前学生</text>

  <path d="M760 1224 C608 1224 608 1292 700 1292" class="self"/>
  <text x="506" y="1252" class="label">注册 Listener</text>
  <text x="506" y="1282" class="small">listenerMap[voiceSessionId] = 当前前端 session</text>

  <path d="M692 1360 H148" class="return"/>
  <text x="420" y="1342" class="label">返回 VOICE_WS_READY</text>
  <text x="420" y="1372" class="small">到这里，前端才开始持续录音并上传 PCM</text>

  <line x1="58" y1="1428" x2="1382" y2="1428" class="sectionLine"/>
  <rect x="72" y="1404" width="312" height="46" rx="23" class="phase"/>
  <text x="94" y="1433" class="section">第三步：学生说话，Java 转发音频</text>

  <rect x="84" y="1490" width="40" height="190" rx="6" class="active"/>
  <rect x="700" y="1490" width="40" height="230" rx="6" class="active"/>
  <rect x="1280" y="1536" width="40" height="188" rx="6" class="active"/>
  <path d="M148 1548 H690" class="arrow"/>
  <text x="420" y="1530" class="label">WebSocket Binary：学生麦克风 PCM</text>
  <text x="420" y="1560" class="small">pcm_s16le / 16000Hz / 单声道</text>

  <path d="M760 1602 C956 1602 956 1648 742 1648" class="self"/>
  <text x="940" y="1586" class="label">根据 voiceSessionId 取火山 WebSocket</text>
  <text x="940" y="1616" class="small">webSocketMap[voiceSessionId]</text>

  <path d="M742 1700 H1274" class="arrow"/>
  <text x="1008" y="1682" class="label">封装火山音频帧并发送</text>
  <text x="1008" y="1712" class="small">event=200，payload 是原始 PCM 字节</text>

  <line x1="58" y1="1770" x2="1382" y2="1770" class="sectionLine"/>
  <rect x="72" y="1746" width="316" height="46" rx="23" class="phase"/>
  <text x="94" y="1775" class="section">第四步：学生点“说完了”，提交本轮回答</text>

  <rect x="84" y="1830" width="40" height="126" rx="6" class="active"/>
  <rect x="700" y="1830" width="40" height="154" rx="6" class="active"/>
  <rect x="1280" y="1908" width="40" height="92" rx="6" class="active"/>
  <path d="M148 1888 H690" class="arrow"/>
  <text x="420" y="1870" class="label">WebSocket Text：AUDIO_COMMIT</text>
  <text x="420" y="1900" class="small">学生手动点击“说完了”，表示这一段回答结束</text>

  <path d="M742 1964 H1274" class="arrow"/>
  <text x="1008" y="1946" class="label">commitAudio：发送空音频帧</text>
  <text x="1008" y="1976" class="small">event=200，payload 长度为 0，不是关闭整场面试</text>

  <line x1="58" y1="2040" x2="1382" y2="2040" class="sectionLine"/>
  <rect x="72" y="2016" width="342" height="46" rx="23" class="phase"/>
  <text x="94" y="2045" class="section">第五步：火山返回文本和面试官声音</text>

  <rect x="1280" y="2100" width="40" height="210" rx="6" class="active"/>
  <rect x="700" y="2100" width="40" height="230" rx="6" class="active"/>
  <rect x="84" y="2168" width="40" height="126" rx="6" class="active"/>

  <path d="M1278 2154 H742" class="return"/>
  <text x="1008" y="2136" class="label">返回服务端协议帧</text>
  <text x="1008" y="2166" class="small">可能是 JSON 文本，也可能是 PCM 音频二进制</text>

  <path d="M760 2218 C940 2218 940 2266 742 2266" class="self"/>
  <text x="948" y="2202" class="label">parseServerFrame 解析火山帧</text>
  <text x="948" y="2232" class="small">拆 messageType、flags、event、sessionId、payload</text>

  <path d="M692 2302 H148" class="return"/>
  <text x="420" y="2284" class="label">转发给前端播放和展示</text>
  <text x="420" y="2314" class="small">文本走 DOUBAO_EVENT JSON；音频走 BinaryMessage PCM</text>
</svg>
