<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Binary 音频回放链路</title>
  <desc id="desc">火山返回 PCM 后，Java 使用 BinaryMessage 转发，前端用 DataView 和 WebAudio 播放。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .box{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .safe{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .warn{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .end{fill:#f3efff;stroke:#7a5bc8;stroke-width:2}
      .text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .split{fill:#fff;stroke:#c9d3df;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcff"/>
  <text x="56" y="58" class="title">AI 面试官声音：不要走 JSON，直接走 Binary</text>
  <text x="56" y="88" class="sub">文本事件适合 JSON；连续音频更适合 WebSocket BinaryMessage。</text>

  <g transform="translate(80,150)">
    <rect class="end" x="0" y="0" width="180" height="78" rx="10"/><text class="text" x="90" y="34">火山 TTS</text><text class="small" x="90" y="58">24k PCM</text>
    <rect class="safe" x="235" y="0" width="190" height="78" rx="10"/><text class="text" x="330" y="34">Java 解析帧</text><text class="small" x="330" y="58">parseServerFrame</text>
    <rect class="safe" x="480" y="0" width="210" height="78" rx="10"/><text class="text" x="585" y="34">BinaryMessage</text><text class="small" x="585" y="58">直接转给浏览器</text>
    <rect class="box" x="745" y="0" width="190" height="78" rx="10"/><text class="text" x="840" y="34">ArrayBuffer</text><text class="small" x="840" y="58">前端收到二进制</text>
    <rect class="warn" x="990" y="0" width="190" height="78" rx="10"/><text class="text" x="1085" y="34">DataView</text><text class="small" x="1085" y="58">按小端读取</text>
    <path class="line" d="M180,39 H225"/><path class="line" d="M425,39 H470"/><path class="line" d="M690,39 H735"/><path class="line" d="M935,39 H980"/>
  </g>

  <g transform="translate(205,360)">
    <rect class="warn" x="0" y="0" width="220" height="90" rx="12"/>
    <text class="text" x="110" y="36">getInt16(i * 2, true)</text>
    <text class="small" x="110" y="62">true 表示 little-endian</text>
    <rect class="box" x="300" y="0" width="220" height="90" rx="12"/>
    <text class="text" x="410" y="36">Float32</text>
    <text class="small" x="410" y="62">转换到 -1 ~ 1</text>
    <rect class="box" x="600" y="0" width="220" height="90" rx="12"/>
    <text class="text" x="710" y="36">AudioBuffer</text>
    <text class="small" x="710" y="62">WebAudio 音频缓冲</text>
    <rect class="end" x="900" y="0" width="220" height="90" rx="12"/>
    <text class="text" x="1010" y="36">扬声器播放</text>
    <text class="small" x="1010" y="62">AudioContext.destination</text>
    <path class="line" d="M220,45 H290"/><path class="line" d="M520,45 H590"/><path class="line" d="M820,45 H890"/>
  </g>

  <rect x="260" y="595" width="760" height="70" rx="12" class="split"/>
  <text x="640" y="625" class="text">前端判断消息类型：string 当 JSON，ArrayBuffer 当 PCM</text>
  <text x="640" y="650" class="small">这样文本和音频互不干扰，延迟也更低。</text>
</svg>
