<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StartSession 配置拆解</title>
  <desc id="desc">StartSession 中 dialog、asr.audio_info 和 tts.audio_config 三类关键配置。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .root{fill:#fff;stroke:#c9d3df;stroke-width:2}
      .dialog{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .asr{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .tts{fill:#f4efff;stroke:#7a5bc8;stroke-width:2}
      .warn{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .head{font:700 21px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033;text-anchor:middle}
      .text{font:17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .code{font:14px Menlo,Consolas,monospace;fill:#334155;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcff"/>
  <text x="56" y="58" class="title">StartSession：最容易配错的是输入音频和输出音频</text>
  <text x="56" y="88" class="sub">dialog 管面试官怎么说；asr.audio_info 管学生声音怎么传；tts.audio_config 管 AI 声音怎么返回。</text>

  <rect x="500" y="130" width="280" height="90" rx="14" class="root"/>
  <text x="640" y="166" class="head">StartSession Payload</text>
  <text x="640" y="193" class="small">发送给火山的会话配置</text>

  <rect x="90" y="330" width="300" height="170" rx="14" class="dialog"/>
  <text x="240" y="365" class="head">dialog</text>
  <text x="240" y="397" class="text">面试官角色和规则</text>
  <text x="240" y="430" class="code">bot_name</text>
  <text x="240" y="455" class="code">system_role</text>
  <text x="240" y="480" class="code">extra.model = 1.2.1.1</text>

  <rect x="490" y="330" width="300" height="170" rx="14" class="asr"/>
  <text x="640" y="365" class="head">asr.audio_info</text>
  <text x="640" y="397" class="text">学生输入音频格式</text>
  <text x="640" y="430" class="code">format: pcm_s16le</text>
  <text x="640" y="455" class="code">sample_rate: 16000</text>
  <text x="640" y="480" class="code">channel: 1</text>

  <rect x="890" y="330" width="300" height="170" rx="14" class="tts"/>
  <text x="1040" y="365" class="head">tts.audio_config</text>
  <text x="1040" y="397" class="text">面试官输出音频格式</text>
  <text x="1040" y="430" class="code">format: pcm_s16le</text>
  <text x="1040" y="455" class="code">sample_rate: 24000</text>
  <text x="1040" y="480" class="code">channel: 1</text>

  <path class="line" d="M568,220 C490,270 340,285 250,330"/>
  <path class="line" d="M640,220 V330"/>
  <path class="line" d="M712,220 C790,270 940,285 1030,330"/>

  <rect x="256" y="590" width="768" height="70" rx="12" class="warn"/>
  <text x="640" y="620" class="text">不要把 asr.audio_info 和 tts.audio_config 混在一起</text>
  <text x="640" y="646" class="small">一个控制“学生说进去”的格式，一个控制“AI 说出来”的格式。</text>
</svg>
