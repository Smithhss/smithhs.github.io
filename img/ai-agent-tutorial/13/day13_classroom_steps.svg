<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">课堂实现顺序</title>
  <desc id="desc">实时语音功能建议按步骤逐段打通。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .box{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .safe{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .warn{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .end{fill:#f3efff;stroke:#7a5bc8;stroke-width:2}
      .text{font:17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .small{font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .num{font:700 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff;text-anchor:middle}
      .dot{fill:#26364a}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcff"/>
  <text x="56" y="58" class="title">课堂实现顺序：实时语音要一段一段打通</text>
  <text x="56" y="88" class="sub">不要同时改前端录音、Java WebSocket、火山协议和 PCM 播放，否则问题会混在一起。</text>

  <g transform="translate(80,150)">
    <rect class="box" x="0" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="24" cy="24" r="14"/><text class="num" x="24" y="30">1</text><text class="text" x="100" y="35">前端页面</text><text class="small" x="100" y="58">开始按钮和状态</text>
    <rect class="box" x="245" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="269" cy="24" r="14"/><text class="num" x="269" y="30">2</text><text class="text" x="345" y="35">启动接口</text><text class="small" x="345" y="58">/voice/start</text>
    <rect class="safe" x="490" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="514" cy="24" r="14"/><text class="num" x="514" y="30">3</text><text class="text" x="590" y="35">连接火山</text><text class="small" x="590" y="58">StartConnection</text>
    <rect class="safe" x="735" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="759" cy="24" r="14"/><text class="num" x="759" y="30">4</text><text class="text" x="835" y="35">StartSession</text><text class="small" x="835" y="58">配置 ASR/TTS</text>
    <rect class="warn" x="980" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="1004" cy="24" r="14"/><text class="num" x="1004" y="30">5</text><text class="text" x="1080" y="35">前端 WS</text><text class="small" x="1080" y="58">VOICE_WS_READY</text>
    <path class="line" d="M190,39 H235"/><path class="line" d="M435,39 H480"/><path class="line" d="M680,39 H725"/><path class="line" d="M925,39 H970"/>
  </g>

  <g transform="translate(80,335)">
    <rect class="warn" x="0" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="24" cy="24" r="14"/><text class="num" x="24" y="30">6</text><text class="text" x="100" y="35">采集麦克风</text><text class="small" x="100" y="58">16k PCM</text>
    <rect class="warn" x="245" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="269" cy="24" r="14"/><text class="num" x="269" y="30">7</text><text class="text" x="345" y="35">转发音频</text><text class="small" x="345" y="58">forwardAudio</text>
    <rect class="end" x="490" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="514" cy="24" r="14"/><text class="num" x="514" y="30">8</text><text class="text" x="590" y="35">提交回答</text><text class="small" x="590" y="58">AUDIO_COMMIT</text>
    <rect class="end" x="735" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="759" cy="24" r="14"/><text class="num" x="759" y="30">9</text><text class="text" x="835" y="35">转发事件</text><text class="small" x="835" y="58">ASR / Chat / TTS</text>
    <rect class="end" x="980" y="0" width="190" height="78" rx="10"/><circle class="dot" cx="1004" cy="24" r="14"/><text class="num" x="1004" y="30">10</text><text class="text" x="1080" y="35">播放 PCM</text><text class="small" x="1080" y="58">WebAudio</text>
    <path class="line" d="M190,39 H235"/><path class="line" d="M435,39 H480"/><path class="line" d="M680,39 H725"/><path class="line" d="M925,39 H970"/>
  </g>

  <rect x="246" y="585" width="788" height="70" rx="12" fill="#fff" stroke="#c9d3df" stroke-width="2"/>
  <text x="640" y="615" class="text">每一步只验证一个问题：连接是否成功、音频是否到达、事件是否返回、PCM 是否播放</text>
  <text x="640" y="640" class="small">长链路功能的排查方法，就是把链路拆短。</text>
</svg>
