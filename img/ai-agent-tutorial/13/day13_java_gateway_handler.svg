<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Java WebSocket Handler 职责</title>
  <desc id="desc">MockInterviewVoiceWebSocketHandler 接收前端音频、提交事件，并把火山返回转发给浏览器。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .center{fill:#ecfdf3;stroke:#329261;stroke-width:2}
      .blue{fill:#eaf4ff;stroke:#3f7fc7;stroke-width:2}
      .purple{fill:#f4efff;stroke:#7a5bc8;stroke-width:2}
      .orange{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .head{font:700 21px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#667085;stroke-width:2.2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcff"/>
  <text x="56" y="58" class="title">Java：MockInterviewVoiceWebSocketHandler 是实时语音入口</text>
  <text x="56" y="88" class="sub">它不做模型推理，只负责把浏览器和火山 Realtime 稳定接起来。</text>

  <rect x="455" y="250" width="370" height="150" rx="18" class="center"/>
  <text x="640" y="306" class="head">MockInterviewVoiceWebSocketHandler</text>
  <text x="640" y="338" class="small">浏览器 WebSocket 的服务端处理器</text>
  <text x="640" y="365" class="small">文本 JSON 和二进制音频都从这里经过</text>

  <rect x="86" y="150" width="250" height="88" rx="12" class="blue"/>
  <text x="211" y="184" class="text">afterConnectionEstablished</text>
  <text x="211" y="210" class="small">注册监听器 / 发送 VOICE_WS_READY</text>
  <path d="M336 194 C390 194 400 278 455 294" class="line"/>

  <rect x="86" y="305" width="250" height="88" rx="12" class="blue"/>
  <text x="211" y="339" class="text">handleBinaryMessage</text>
  <text x="211" y="365" class="small">接收学生 PCM 并转发火山</text>
  <path d="M336 349 H455" class="line"/>

  <rect x="86" y="460" width="250" height="88" rx="12" class="blue"/>
  <text x="211" y="494" class="text">handleTextMessage</text>
  <text x="211" y="520" class="small">处理 AUDIO_COMMIT</text>
  <path d="M336 504 C390 504 400 372 455 356" class="line"/>

  <rect x="944" y="150" width="250" height="88" rx="12" class="purple"/>
  <text x="1069" y="184" class="text">forwardDoubaoEvent</text>
  <text x="1069" y="210" class="small">转发火山文本和音频</text>
  <path d="M825 294 C880 278 890 194 944 194" class="dash"/>

  <rect x="944" y="305" width="250" height="88" rx="12" class="orange"/>
  <text x="1069" y="339" class="text">sendLock</text>
  <text x="1069" y="365" class="small">同一 session 排队发送</text>
  <path d="M825 349 H944" class="dash"/>

  <rect x="944" y="460" width="250" height="88" rx="12" class="purple"/>
  <text x="1069" y="494" class="text">afterConnectionClosed</text>
  <text x="1069" y="520" class="small">关闭火山连接 / 清理监听器</text>
  <path d="M825 356 C880 372 890 504 944 504" class="dash"/>

  <rect x="296" y="620" width="688" height="58" rx="12" fill="#fff" stroke="#c9d3df" stroke-width="2"/>
  <text x="640" y="645" class="text">核心原则：前端音频进来就转发，火山事件回来就按类型转发给前端</text>
  <text x="640" y="667" class="small">不要把文本、控制事件和大块音频都混进一个 JSON 里。</text>
</svg>
