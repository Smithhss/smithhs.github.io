<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 20px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .ok{fill:#f0fdf4;stroke:#86efac}
      .bad{fill:#fff1f2;stroke:#fda4af}
      .h{font:700 15px Arial,'Microsoft YaHei',sans-serif;fill:#172033}
      .t{font:13px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="35" y="38" class="title">断言判断流程：每条规则都有结果</text>
  <rect x="55" y="90" width="175" height="80" class="box"/>
  <text x="78" y="123" class="h">实际 State</text>
  <text x="78" y="148" class="t">actual_state_json</text>
  <rect x="285" y="90" width="190" height="80" class="box"/>
  <text x="308" y="123" class="h">逐条读取断言</text>
  <text x="308" y="148" class="t">actual_key + operator</text>
  <rect x="530" y="90" width="195" height="80" class="box"/>
  <text x="553" y="123" class="h">执行判断</text>
  <text x="553" y="148" class="t">EQ / CONTAINS / REGEX...</text>
  <rect x="780" y="90" width="195" height="80" class="box ok"/>
  <text x="803" y="123" class="h">保存断言结果</text>
  <text x="803" y="148" class="t">实际值、是否通过、原因</text>
  <path d="M230 130 H275" class="line"/>
  <path d="M475 130 H520" class="line"/>
  <path d="M725 130 H770" class="line"/>

  <rect x="220" y="230" width="250" height="70" class="box ok"/>
  <text x="242" y="258" class="h">所有必过规则通过</text>
  <text x="242" y="282" class="t">样本 passed = true</text>
  <rect x="570" y="230" width="260" height="70" class="box bad"/>
  <text x="592" y="258" class="h">存在必过规则失败</text>
  <text x="592" y="282" class="t">样本失败，取第一条必过失败类型</text>
  <path d="M878 170 C835 215 780 225 710 230" class="line"/>
  <path d="M878 170 C805 215 455 220 350 230" class="line"/>
</svg>
