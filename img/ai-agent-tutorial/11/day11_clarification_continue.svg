<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .blue{fill:#e0f2fe;stroke:#0284c7}
      .orange{fill:#fff7ed;stroke:#f97316}
      .green{fill:#ecfdf5;stroke:#10b981}
      .title{font:700 17px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
      .text{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#334155}
      .small{font:12px Arial,'Microsoft YaHei',sans-serif;fill:#64748b}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="30" y="34" class="title">澄清继续评测流程</text>
  <rect x="45" y="75" width="150" height="72" class="box blue"/>
  <text x="73" y="105" class="title">第一轮样本</text>
  <text x="67" y="128" class="text">question 发起 route</text>
  <rect x="240" y="75" width="170" height="72" class="box orange"/>
  <text x="266" y="105" class="title">需要澄清</text>
  <text x="257" y="128" class="text">CLARIFICATION_REQUIRED</text>
  <rect x="455" y="75" width="175" height="72" class="box orange"/>
  <text x="481" y="105" class="title">任务待澄清</text>
  <text x="474" y="128" class="text">WAITING_CLARIFICATION</text>
  <rect x="675" y="75" width="170" height="72" class="box"/>
  <text x="701" y="105" class="title">补充回答</text>
  <text x="699" y="128" class="text">按单条结果填写</text>
  <rect x="240" y="230" width="170" height="72" class="box blue"/>
  <text x="271" y="260" class="title">调用 continue</text>
  <text x="264" y="283" class="text">使用同一 conversationId</text>
  <rect x="455" y="230" width="175" height="72" class="box"/>
  <text x="481" y="260" class="title">重新判定</text>
  <text x="475" y="283" class="text">更新实际 State / SQL</text>
  <rect x="675" y="230" width="170" height="72" class="box green"/>
  <text x="704" y="260" class="title">任务汇总</text>
  <text x="700" y="283" class="text">全部处理后完成</text>
  <path d="M195 111 H230" class="arrow"/>
  <path d="M410 111 H445" class="arrow"/>
  <path d="M630 111 H665" class="arrow"/>
  <path d="M760 147 C760 200 425 190 330 230" class="arrow"/>
  <path d="M410 266 H445" class="arrow"/>
  <path d="M630 266 H665" class="arrow"/>
  <text x="725" y="186" class="small">每条样本自己的 graph thread</text>
</svg>
