<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .blue{fill:#e0f2fe;stroke:#0284c7}
      .green{fill:#ecfdf5;stroke:#10b981}
      .orange{fill:#fff7ed;stroke:#f97316}
      .red{fill:#fef2f2;stroke:#ef4444}
      .title{font:700 17px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
      .text{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#334155}
      .small{font:12px Arial,'Microsoft YaHei',sans-serif;fill:#64748b}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="30" y="34" class="title">异步评测任务流程</text>
  <rect x="45" y="78" width="155" height="70" class="box blue"/>
  <text x="73" y="107" class="title">选择样本</text>
  <text x="65" y="130" class="text">只选择 ACTIVE</text>
  <rect x="245" y="78" width="155" height="70" class="box"/>
  <text x="266" y="107" class="title">创建任务</text>
  <text x="266" y="130" class="text">status=RUNNING</text>
  <rect x="445" y="78" width="155" height="70" class="box orange"/>
  <text x="466" y="107" class="title">立即返回</text>
  <text x="462" y="130" class="text">页面拿到任务ID</text>
  <rect x="645" y="78" width="155" height="70" class="box"/>
  <text x="671" y="107" class="title">后台执行</text>
  <text x="664" y="130" class="text">逐条跑完整 graph</text>
  <rect x="245" y="230" width="155" height="70" class="box green"/>
  <text x="267" y="259" class="title">COMPLETED</text>
  <text x="266" y="282" class="text">没有待澄清样本</text>
  <rect x="445" y="230" width="190" height="70" class="box orange"/>
  <text x="467" y="259" class="title">WAITING_CLARIFICATION</text>
  <text x="471" y="282" class="text">有样本需要补充</text>
  <rect x="680" y="230" width="155" height="70" class="box red"/>
  <text x="724" y="259" class="title">FAILED</text>
  <text x="704" y="282" class="text">任务级异常</text>
  <path d="M200 113 H235" class="arrow"/>
  <path d="M400 113 H435" class="arrow"/>
  <path d="M600 113 H635" class="arrow"/>
  <path d="M722 148 C710 190 565 216 530 230" class="arrow"/>
  <path d="M720 148 C675 190 390 210 325 230" class="arrow"/>
  <path d="M740 148 C775 184 785 205 765 230" class="arrow"/>
  <text x="808" y="112" class="small">页面轮询任务状态和结果</text>
</svg>
