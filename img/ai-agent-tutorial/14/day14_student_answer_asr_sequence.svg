<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">学生回答阶段 ASR 时序</title>
  <desc id="desc">用户点击开始回答后，前端先打开麦克风但不发送，Java 建好火山 ASR 后再放开发送 PCM。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#1f2937"/></marker>
    <style>
      .title{font:700 32px Arial,"PingFang SC","Microsoft YaHei";fill:#111827}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei";fill:#667085}
      .role{font:700 18px Arial,"PingFang SC","Microsoft YaHei";fill:#1f2937;text-anchor:middle}
      .line{stroke:#cbd5e1;stroke-width:2}
      .msg{stroke:#1f2937;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2.2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .label{font:16px Arial,"PingFang SC","Microsoft YaHei";fill:#243447;text-anchor:middle}
      .green{fill:#ecfdf3;stroke:#86efac;stroke-width:2}
      .orange{fill:#fff7ed;stroke:#fdba74;stroke-width:2}
      .txt{font:700 17px Arial,"PingFang SC","Microsoft YaHei";fill:#344054;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei";fill:#667085;text-anchor:middle}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcff"/>
  <text x="60" y="58" class="title">学生回答：ASR 在“开始回答”时才打开</text>
  <text x="60" y="88" class="sub">这一步解决了“ASR 空等 8 秒超时”的问题，也避免丢第一段音频。</text>

  <text x="160" y="140" class="role">前端</text>
  <text x="390" y="140" class="role">Java Handler</text>
  <text x="670" y="140" class="role">VolcengineStreamingAsrClient</text>
  <text x="1020" y="140" class="role">火山流式 ASR</text>
  <line x1="160" y1="162" x2="160" y2="690" class="line"/>
  <line x1="390" y1="162" x2="390" y2="690" class="line"/>
  <line x1="670" y1="162" x2="670" y2="690" class="line"/>
  <line x1="1020" y1="162" x2="1020" y2="690" class="line"/>

  <rect x="58" y="185" width="204" height="74" rx="12" class="orange"/>
  <text x="160" y="216" class="txt">用户点击“开始回答”</text>
  <text x="160" y="240" class="small">先开本地麦克风，但 committed=true</text>

  <path d="M160 292 H390" class="msg"/><text x="275" y="282" class="label">READY_FOR_STUDENT_SPEECH</text>
  <path d="M390 340 H670" class="msg"/><text x="530" y="330" class="label">start(studentId, sessionId)</text>
  <path d="M670 390 H1020" class="msg"/><text x="845" y="380" class="label">连接火山 ASR WS + full client request</text>
  <path d="M670 442 H390" class="dash"/><text x="530" y="432" class="label">ASR session active</text>
  <path d="M390 490 H160" class="dash"/><text x="275" y="480" class="label">ASR_READY</text>

  <rect x="58" y="520" width="204" height="74" rx="12" class="green"/>
  <text x="160" y="552" class="txt">committed=false</text>
  <text x="160" y="576" class="small">开始把 PCM 发给 Java</text>

  <path d="M160 626 H390" class="msg"/><text x="275" y="616" class="label">Binary PCM 16k</text>
  <path d="M390 654 H670" class="msg"/><text x="530" y="644" class="label">sendAudio(sequence=2,3...)</text>
  <path d="M670 682 H1020" class="msg"/><text x="845" y="672" class="label">audio only request</text>
</svg>
