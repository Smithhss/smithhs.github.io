<svg width="1280" height="700" viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">结束面试流程</title>
  <desc id="desc">前端发送 END_INTERVIEW，Java 关闭 ASR，更新 MySQL 会话状态，再通知前端清理资源。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#1f2937"/></marker>
    <style>
      .title{font:700 32px Arial,"PingFang SC","Microsoft YaHei";fill:#111827}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei";fill:#667085}
      .role{font:700 18px Arial,"PingFang SC","Microsoft YaHei";fill:#1f2937;text-anchor:middle}
      .line{stroke:#cbd5e1;stroke-width:2}
      .msg{stroke:#1f2937;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2.2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .label{font:16px Arial,"PingFang SC","Microsoft YaHei";fill:#243447;text-anchor:middle}
      .box{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}
      .txt{font:700 18px Arial,"PingFang SC","Microsoft YaHei";fill:#991b1b;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei";fill:#667085;text-anchor:middle}
    </style>
  </defs>
  <rect width="1280" height="700" fill="#fbfcff"/>
  <text x="60" y="58" class="title">结束面试：关闭连接并标记 session 完成</text>
  <text x="60" y="88" class="sub">红色结束按钮不再只是本地 stop，而是会通知后端更新数据库。</text>

  <text x="190" y="140" class="role">前端 V2 页面</text>
  <text x="460" y="140" class="role">Java Handler</text>
  <text x="730" y="140" class="role">火山 ASR</text>
  <text x="1010" y="140" class="role">MySQL</text>
  <line x1="190" y1="162" x2="190" y2="620" class="line"/>
  <line x1="460" y1="162" x2="460" y2="620" class="line"/>
  <line x1="730" y1="162" x2="730" y2="620" class="line"/>
  <line x1="1010" y1="162" x2="1010" y2="620" class="line"/>

  <path d="M190 210 H460" class="msg"/><text x="325" y="200" class="label">END_INTERVIEW</text>
  <path d="M460 270 H730" class="msg"/><text x="595" y="260" class="label">close(asrSessionId)</text>
  <path d="M460 330 H1010" class="msg"/><text x="735" y="320" class="label">finishSession：status=FINISHED, finished_at=now</text>
  <path d="M1010 385 H460" class="dash"/><text x="735" y="375" class="label">updated rows</text>
  <path d="M460 445 H190" class="dash"/><text x="325" y="435" class="label">INTERVIEW_FINISHED</text>
  <path d="M190 505 H190" class="msg"/><text x="318" y="497" class="label">关闭麦克风 / 播放队列 / Java WS</text>

  <rect x="365" y="560" width="550" height="74" rx="14" class="box"/>
  <text x="640" y="590" class="txt">当前结束流程只做“结束和清理”</text>
  <text x="640" y="616" class="small">面试报告生成还没有接入，后续可以基于 mock_interview_message 生成报告。</text>
</svg>
