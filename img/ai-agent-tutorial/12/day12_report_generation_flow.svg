<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">复盘报告生成材料</title>
  <desc id="desc">展示录音、对话稿、简历和备注如何汇总成面试复盘报告。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .bg{fill:#fbfcff}
      .title{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5c6b7c}
      .input{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .process{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .report{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .label{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="560"/>
  <text x="56" y="58" class="title">复盘报告不是听写稿，而是结构化分析</text>
  <text x="56" y="88" class="sub">对话稿负责还原问答，简历负责提供背景，AI 报告负责指出问题、原因和下次怎么答。</text>

  <rect x="80" y="150" width="210" height="76" rx="14" class="input"/>
  <text x="185" y="181" class="label">speaker/text 对话</text>
  <text x="185" y="205" class="small">谁说了什么</text>
  <rect x="80" y="270" width="210" height="76" rx="14" class="input"/>
  <text x="185" y="301" class="label">学生简历</text>
  <text x="185" y="325" class="small">项目、技能、经历</text>
  <rect x="80" y="390" width="210" height="76" rx="14" class="input"/>
  <text x="185" y="421" class="label">学生备注</text>
  <text x="185" y="445" class="small">岗位、公司、反馈点</text>

  <rect x="440" y="220" width="280" height="150" rx="18" class="process"/>
  <text x="580" y="270" class="label">AI 复盘分析</text>
  <text x="580" y="300" class="small">角色识别 / 问题抽取</text>
  <text x="580" y="326" class="small">回答质量 / 简历关联</text>

  <rect x="870" y="145" width="290" height="300" rx="18" class="report"/>
  <text x="1015" y="190" class="label">面试复盘报告</text>
  <text x="1015" y="235" class="small">面试概要</text>
  <text x="1015" y="270" class="small">问题清单</text>
  <text x="1015" y="305" class="small">回答问题分析</text>
  <text x="1015" y="340" class="small">简历关联建议</text>
  <text x="1015" y="375" class="small">推荐回答</text>

  <path d="M290 188 C350 205 390 240 430 270" class="line"/>
  <path d="M290 308 H430" class="line"/>
  <path d="M290 428 C350 405 390 360 430 326" class="line"/>
  <path d="M720 295 H860" class="line"/>
</svg>
