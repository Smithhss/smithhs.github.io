<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">说话人聚类和角色识别</title>
  <desc id="desc">ASR 返回 speaker 只代表声音聚类，后续可由大模型判断面试官和学生角色。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .bg{fill:#fbfcff}
      .title{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5c6b7c}
      .card{fill:#fff;stroke:#d0d5dd;stroke-width:2}
      .speaker{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .llm{fill:#f3efff;stroke:#7a5bc8;stroke-width:2}
      .role{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .report{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .label{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .center{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173}
      .smallCenter{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="560"/>
  <text x="56" y="58" class="title">speaker 不是“学生/面试官”，它只是声音分组</text>
  <text x="56" y="88" class="sub">第一版页面展示“说话人 1 / 说话人 2”；生成报告前再结合内容判断角色，更稳。</text>

  <rect x="70" y="150" width="310" height="250" rx="16" class="card"/>
  <text x="96" y="188" class="label">ASR 分句结果</text>
  <rect x="100" y="220" width="250" height="58" rx="10" class="speaker"/>
  <text x="122" y="244" class="small">speaker = 1</text>
  <text x="122" y="265" class="small">你现在还在这家公司吗？</text>
  <rect x="100" y="305" width="250" height="58" rx="10" class="speaker"/>
  <text x="122" y="329" class="small">speaker = 2</text>
  <text x="122" y="350" class="small">离职了。</text>

  <rect x="485" y="205" width="250" height="130" rx="16" class="llm"/>
  <text x="610" y="258" class="center">角色识别</text>
  <text x="610" y="286" class="smallCenter">根据问答内容推断</text>

  <rect x="845" y="150" width="300" height="100" rx="16" class="role"/>
  <text x="995" y="190" class="center">说话人 1 = 面试官</text>
  <text x="995" y="218" class="smallCenter">通常负责提问和追问</text>
  <rect x="845" y="300" width="300" height="100" rx="16" class="role"/>
  <text x="995" y="340" class="center">说话人 2 = 学生</text>
  <text x="995" y="368" class="smallCenter">通常负责回答和解释项目</text>

  <rect x="485" y="430" width="250" height="72" rx="14" class="report"/>
  <text x="610" y="459" class="center">复盘报告</text>
  <text x="610" y="484" class="smallCenter">问题、回答、建议</text>

  <path d="M380 275 H475" class="line"/>
  <path d="M735 270 C790 230 800 205 835 200" class="line"/>
  <path d="M735 270 C790 310 800 345 835 350" class="line"/>
  <path d="M995 400 C960 472 785 466 745 466" class="line"/>
  <path d="M995 250 C950 430 790 466 745 466" class="line"/>
</svg>
