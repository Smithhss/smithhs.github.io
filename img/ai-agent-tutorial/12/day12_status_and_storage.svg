<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">转写状态和数据库保存字段</title>
  <desc id="desc">展示面试复盘记录从 PENDING 到 PROCESSING、SUCCESS 或 FAILED 的状态流和核心保存字段。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .bg{fill:#fbfcff}
      .title{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5c6b7c}
      .state{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .ok{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .bad{fill:#fef2f2;stroke:#d92d20;stroke-width:2}
      .db{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .label{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .field{font:15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#667085;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="560"/>
  <text x="56" y="58" class="title">转写状态只表达处理进度，内容只保存对话稿</text>
  <text x="56" y="88" class="sub">第一版不保存完整纯文本和原始 ASR JSON；复盘需要的核心是 speaker + text。</text>

  <rect x="78" y="190" width="170" height="78" rx="14" class="state"/>
  <text x="163" y="224" class="label">PENDING</text>
  <text x="163" y="248" class="small">录音已上传</text>
  <rect x="330" y="190" width="190" height="78" rx="14" class="state"/>
  <text x="425" y="224" class="label">PROCESSING</text>
  <text x="425" y="248" class="small">ASR 处理中</text>
  <rect x="610" y="130" width="170" height="78" rx="14" class="ok"/>
  <text x="695" y="164" class="label">SUCCESS</text>
  <text x="695" y="188" class="small">保存对话</text>
  <rect x="610" y="285" width="170" height="78" rx="14" class="bad"/>
  <text x="695" y="319" class="label">FAILED</text>
  <text x="695" y="343" class="small">允许重试</text>

  <path d="M248 229 H320" class="line"/>
  <path d="M520 229 C560 215 580 190 600 174" class="line"/>
  <path d="M520 229 C560 255 580 295 600 320" class="line"/>
  <path d="M610 324 C500 410 375 345 414 278" class="dash"/>
  <path d="M695 208 C720 255 710 260 695 285" class="dash"/>

  <rect x="885" y="126" width="305" height="300" rx="16" class="db"/>
  <text x="1038" y="165" class="label">interview_review_record</text>
  <text x="918" y="205" class="field">transcript_status</text>
  <text x="918" y="238" class="field">transcript_task_id</text>
  <text x="918" y="271" class="field">transcript_dialogue_json</text>
  <text x="918" y="304" class="field">transcript_error_message</text>
  <text x="918" y="337" class="field">transcript_started_at</text>
  <text x="918" y="370" class="field">transcript_completed_at</text>
  <path d="M780 169 H875" class="line"/>
  <path d="M780 324 C820 324 830 304 875 304" class="line"/>
</svg>
