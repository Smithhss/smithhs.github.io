<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">按钮提交和定时轮询流程</title>
  <desc id="desc">学生上传录音后点击开始转写，后端提交任务，定时任务查询处理结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .bg{fill:#fbfcff}
      .title{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5c6b7c}
      .box{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .green{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .orange{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .purple{fill:#f3efff;stroke:#7a5bc8;stroke-width:2}
      .text{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#667085;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="560"/>
  <text x="56" y="58" class="title">第一版转写流程：按钮提交 + 后端定时查询</text>
  <text x="56" y="88" class="sub">上传接口只保存记录；真正的 ASR 任务由“开始转写”按钮触发，避免上传时长时间阻塞。</text>

  <g transform="translate(74,150)">
    <rect x="0" y="0" width="160" height="74" rx="12" class="box"/>
    <text x="80" y="33" class="text">上传录音</text>
    <text x="80" y="57" class="small">对象存储</text>
    <rect x="220" y="0" width="180" height="74" rx="12" class="green"/>
    <text x="310" y="33" class="text">保存复盘记录</text>
    <text x="310" y="57" class="small">PENDING</text>
    <rect x="460" y="0" width="180" height="74" rx="12" class="orange"/>
    <text x="550" y="33" class="text">点击开始转写</text>
    <text x="550" y="57" class="small">页面按钮</text>
    <rect x="700" y="0" width="190" height="74" rx="12" class="green"/>
    <text x="795" y="33" class="text">提交 ASR</text>
    <text x="795" y="57" class="small">保存 taskId</text>
    <rect x="950" y="0" width="180" height="74" rx="12" class="orange"/>
    <text x="1040" y="33" class="text">定时任务</text>
    <text x="1040" y="57" class="small">每 60 秒轮询</text>
    <path d="M160 37 H210" class="line"/>
    <path d="M400 37 H450" class="line"/>
    <path d="M640 37 H690" class="line"/>
    <path d="M890 37 H940" class="line"/>
  </g>

  <g transform="translate(248,340)">
    <rect x="0" y="0" width="190" height="78" rx="12" class="purple"/>
    <text x="95" y="34" class="text">PROCESSING</text>
    <text x="95" y="58" class="small">等待识别完成</text>
    <rect x="280" y="0" width="190" height="78" rx="12" class="green"/>
    <text x="375" y="34" class="text">SUCCESS</text>
    <text x="375" y="58" class="small">保存 speaker/text</text>
    <rect x="560" y="0" width="190" height="78" rx="12" class="orange"/>
    <text x="655" y="34" class="text">FAILED</text>
    <text x="655" y="58" class="small">保存失败原因</text>
    <path d="M190 39 H270" class="line"/>
    <path d="M190 39 C290 110 520 110 650 80" class="dash"/>
  </g>
  <path d="M1114 224 C1180 290 1030 379 998 379" class="dash"/>
</svg>
