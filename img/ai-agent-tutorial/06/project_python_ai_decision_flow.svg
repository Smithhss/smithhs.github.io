<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
  <defs>
    <style>
      .bg{fill:#f7f9fb}
      .title{font:700 30px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .box{fill:#fff;stroke:#aebccc;stroke-width:2;rx:10}
      .start{fill:#eaf4ff;stroke:#4f8fd9}
      .decide{fill:#fff6ea;stroke:#d98a22}
      .python{fill:#f4efff;stroke:#8b6bd9}
      .java{fill:#eaf8f0;stroke:#46a36c}
      .model{fill:#f9eef1;stroke:#d66f86}
      .label{font:700 16px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .text{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#667085}
      .arrow{stroke:#617083;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#617083;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#617083"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="940"/>
  <text x="40" y="48" class="title">Python AI 服务内部决策流程</text>
  <text x="40" y="76" class="small">对应 ChatService.stream_chat：先取 RAG，再取提示词，再组 messages，最后判断是否走工具调用分支。</text>

  <rect x="512" y="104" width="255" height="64" class="box start"/>
  <text x="556" y="130" class="label">收到 ChatStreamRequest</text>
  <text x="540" y="153" class="text">studentId/sessionId/message/history/promptCode</text>

  <rect x="512" y="202" width="255" height="72" class="box decide"/>
  <text x="552" y="230" class="label">是否配置默认知识库？</text>
  <text x="565" y="253" class="small">ai_chat_default_knowledge_base_id</text>

  <rect x="120" y="316" width="245" height="78" class="box python"/>
  <text x="162" y="344" class="label">知识库路由器</text>
  <text x="146" y="367" class="text">强制配置 → 关键词 → 小模型 JSON 判断</text>
  <text x="154" y="388" class="small">ChatKnowledgeRouter</text>

  <rect x="120" y="438" width="245" height="78" class="box python"/>
  <text x="165" y="466" class="label">知识库检索</text>
  <text x="142" y="489" class="text">KnowledgeService.search</text>
  <text x="142" y="510" class="small">LlamaIndex Retriever → Milvus</text>

  <rect x="512" y="316" width="255" height="78" class="box java"/>
  <text x="560" y="344" class="label">读取当前提示词</text>
  <text x="548" y="367" class="text">JavaPromptClient 调 Java 内部接口</text>
  <text x="565" y="388" class="small">按 promptCode 获取生效版本</text>

  <rect x="512" y="438" width="255" height="78" class="box python"/>
  <text x="556" y="466" class="label">组装 messages</text>
  <text x="544" y="489" class="text">system + 知识库资料 + history + user</text>
  <text x="570" y="510" class="small">ChatPromptBuilder</text>

  <rect x="512" y="560" width="255" height="78" class="box decide"/>
  <text x="544" y="588" class="label">工具调用是否开启？</text>
  <text x="557" y="611" class="text">ai_chat_tools_enabled</text>
  <text x="550" y="632" class="small">并按问题筛选候选工具</text>

  <rect x="120" y="682" width="245" height="78" class="box python"/>
  <text x="164" y="710" class="label">工具路由器</text>
  <text x="148" y="733" class="text">返回本轮可开放工具名称</text>
  <text x="155" y="754" class="small">ChatToolRouter + Registry</text>

  <rect x="120" y="804" width="245" height="78" class="box python"/>
  <text x="150" y="832" class="label">ToolChatAgent</text>
  <text x="145" y="855" class="text">工具决策模型 → 执行工具 → 最终模型</text>
  <text x="148" y="876" class="small">两段式工具调用</text>

  <rect x="895" y="682" width="245" height="78" class="box model"/>
  <text x="945" y="710" class="label">普通模型流</text>
  <text x="930" y="733" class="text">llm_provider.stream_chat</text>
  <text x="933" y="754" class="small">不传 tools，直接回答</text>

  <rect x="512" y="804" width="255" height="78" class="box start"/>
  <text x="555" y="832" class="label">统一输出 SSE</text>
  <text x="555" y="855" class="text">message_start / chunk / done</text>
  <text x="552" y="876" class="small">done 携带知识库引用和 token</text>

  <path d="M640 168 V202" class="arrow"/>
  <path d="M512 238 C405 240 382 340 365 354" class="arrow"/>
  <path d="M242 394 V438" class="arrow"/>
  <path d="M365 477 H512" class="dash"/>
  <path d="M640 274 V316" class="arrow"/>
  <path d="M640 394 V438" class="arrow"/>
  <path d="M640 516 V560" class="arrow"/>
  <path d="M512 600 C430 604 400 705 365 721" class="arrow"/>
  <path d="M242 760 V804" class="arrow"/>
  <path d="M365 843 H512" class="dash"/>
  <path d="M767 600 C850 604 878 705 895 721" class="arrow"/>
  <path d="M1018 760 C980 850 820 843 767 843" class="dash"/>
  <text x="405" y="238" class="small">需要 RAG</text>
  <text x="796" y="594" class="small">无候选工具</text>
  <text x="404" y="594" class="small">有候选工具</text>
</svg>
