<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      .bg{fill:#f7f9fb}
      .title{font:700 30px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .box{fill:#fff;stroke:#aebccc;stroke-width:2;rx:10}
      .python{fill:#f4efff;stroke:#8b6bd9}
      .java{fill:#eaf8f0;stroke:#46a36c}
      .model{fill:#f9eef1;stroke:#d66f86}
      .store{fill:#fff6ea;stroke:#d98a22}
      .decide{fill:#fff6ea;stroke:#d98a22}
      .label{font:700 16px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .text{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#667085}
      .arrow{stroke:#617083;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#617083;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#617083"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text x="40" y="48" class="title">工具调用详细流程：以“我今天上什么课？”为例</text>
  <text x="40" y="76" class="small">工具参数只允许模型填写 date，studentId 来自 Java 已鉴权上下文，避免越权。</text>

  <rect x="505" y="104" width="270" height="64" class="box python"/>
  <text x="564" y="130" class="label">ChatService 已组装 messages</text>
  <text x="546" y="153" class="text">system + history + user question</text>

  <rect x="505" y="210" width="270" height="70" class="box decide"/>
  <text x="548" y="238" class="label">工具总开关是否开启？</text>
  <text x="565" y="261" class="small">ai_chat_tools_enabled</text>

  <rect x="105" y="330" width="250" height="76" class="box python"/>
  <text x="158" y="358" class="label">工具路由器</text>
  <text x="132" y="381" class="text">根据问题选择可开放工具</text>
  <text x="138" y="402" class="small">ChatToolRouter.route</text>

  <rect x="105" y="454" width="250" height="76" class="box python"/>
  <text x="160" y="482" class="label">工具注册表</text>
  <text x="132" y="505" class="text">取工具 definitions/schema</text>
  <text x="132" y="526" class="small">StudentDayScheduleTool / DayDutyTool</text>

  <rect x="505" y="330" width="270" height="76" class="box model"/>
  <text x="558" y="358" class="label">工具决策模型</text>
  <text x="532" y="381" class="text">只判断是否 tool_call 和参数</text>
  <text x="550" y="402" class="small">不负责最终回答</text>

  <rect x="505" y="454" width="270" height="76" class="box decide"/>
  <text x="548" y="482" class="label">是否返回 tool_calls？</text>
  <text x="540" y="505" class="text">没有则走普通最终回答模型</text>

  <rect x="905" y="330" width="250" height="76" class="box python"/>
  <text x="954" y="358" class="label">执行工具调用</text>
  <text x="932" y="381" class="text">Registry.execute 解析 arguments</text>
  <text x="930" y="402" class="small">未知工具/非法 JSON 都有兜底</text>

  <rect x="905" y="454" width="250" height="76" class="box java"/>
  <text x="935" y="482" class="label">调用 Java 内部接口</text>
  <text x="922" y="505" class="text">/internal/ai/tools/student-day-schedule</text>
  <text x="940" y="526" class="small">X-Internal-Token 校验</text>

  <rect x="905" y="578" width="250" height="76" class="box store"/>
  <text x="946" y="606" class="label">Java 查询业务数据</text>
  <text x="932" y="629" class="text">学生 → 班级 → 当天课表</text>
  <text x="935" y="650" class="small">返回结构化工具结果</text>

  <rect x="505" y="578" width="270" height="76" class="box python"/>
  <text x="560" y="606" class="label">拼回 tool 消息</text>
  <text x="528" y="629" class="text">assistant tool_calls + role=tool 结果</text>
  <text x="550" y="650" class="small">保持 tool_call_id 对应</text>

  <rect x="505" y="702" width="270" height="76" class="box model"/>
  <text x="552" y="730" class="label">最终回答模型</text>
  <text x="532" y="753" class="text">不再传 tools，只读工具结果</text>
  <text x="552" y="774" class="small">流式生成自然语言</text>

  <rect x="105" y="702" width="250" height="76" class="box python"/>
  <text x="158" y="730" class="label">SSE 返回前端</text>
  <text x="150" y="753" class="text">chunk / done</text>
  <text x="130" y="774" class="small">Java 保存完整 assistant 消息</text>

  <path d="M640 168 V210" class="arrow"/>
  <path d="M505 245 C420 250 385 360 355 368" class="arrow"/>
  <path d="M230 406 V454" class="arrow"/>
  <path d="M355 492 C420 492 432 370 505 368" class="arrow"/>
  <path d="M640 406 V454" class="arrow"/>
  <path d="M775 492 H905" class="arrow"/>
  <path d="M1030 406 V454" class="arrow"/>
  <path d="M1030 530 V578" class="arrow"/>
  <path d="M905 616 H775" class="dash"/>
  <path d="M640 654 V702" class="arrow"/>
  <path d="M505 740 H355" class="dash"/>
  <path d="M775 245 C830 250 855 355 905 368" class="dash"/>
  <text x="796" y="238" class="small">关闭或无候选工具：直接回答</text>
</svg>
