<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <defs>
    <style>
      .title{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:30px;font-weight:700;fill:#222}
      .subtitle{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#59636f}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#2f3742}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;fill:#59636f}
      .box{fill:#fff;stroke:#ccd5e0;stroke-width:2;rx:10}
      .client{fill:#eef6ff;stroke:#4d92d9}
      .adapter{fill:#fff7ea;stroke:#df9b3f}
      .server{fill:#f7f5ff;stroke:#7a68d8}
      .agent{fill:#f4fbf3;stroke:#62a765}
      .model{fill:#f7f9fb;stroke:#b8c2cc}
      .arrow{stroke:#53616f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .return{stroke:#7a68d8;stroke-width:2.5;fill:none;marker-end:url(#arrowPurple)}
      .note{fill:#fff;stroke:#d8dee6;stroke-width:1.5;rx:8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#53616f"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7a68d8"/>
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#fbfcfe"/>
  <text x="48" y="58" class="title">Agent 接入 MCP Server 的过程</text>
  <text x="48" y="90" class="subtitle">MultiServerMCPClient 负责连接 MCP Server，并把 MCP Tools 转成 LangChain Agent 可以使用的 Tools。</text>

  <rect x="60" y="155" width="230" height="116" class="box client"/>
  <text x="117" y="194" class="text" font-weight="700">HTTP MCP Server</text>
  <text x="94" y="224" class="small">07_streamable_http_server.py</text>
  <text x="96" y="249" class="small">暴露 query_course 等工具</text>

  <rect x="445" y="135" width="260" height="156" class="box adapter"/>
  <text x="468" y="178" class="text" font-weight="700">MultiServerMCPClient</text>
  <text x="483" y="210" class="small">连接一个或多个 MCP Server</text>
  <text x="489" y="235" class="small">读取 MCP Tools 列表</text>
  <text x="478" y="260" class="small">转换成 LangChain Tools</text>

  <rect x="840" y="155" width="220" height="116" class="box agent"/>
  <text x="887" y="194" class="text" font-weight="700">LangChain Agent</text>
  <text x="879" y="224" class="small">create_agent(...)</text>
  <text x="876" y="249" class="small">拿到 tools 后可调用</text>

  <rect x="155" y="390" width="230" height="105" class="box server"/>
  <text x="208" y="430" class="text" font-weight="700">MCP Tool</text>
  <text x="194" y="460" class="small">query_course(keyword)</text>

  <rect x="445" y="390" width="260" height="105" class="box model"/>
  <text x="499" y="430" class="text" font-weight="700">LangChain Tool</text>
  <text x="486" y="460" class="small">Agent 可识别、可调用的工具</text>

  <rect x="840" y="390" width="220" height="105" class="box agent"/>
  <text x="884" y="430" class="text" font-weight="700">工具调用结果</text>
  <text x="875" y="460" class="small">交回模型组织回答</text>

  <path d="M290 213 L445 213" class="arrow"/>
  <text x="322" y="197" class="small">HTTP URL 连接</text>

  <path d="M705 213 L840 213" class="arrow"/>
  <text x="724" y="197" class="small">tools=mcp_tools</text>

  <path d="M270 271 C270 320 270 348 270 390" class="arrow"/>
  <text x="288" y="336" class="small">暴露工具</text>

  <path d="M385 442 L445 442" class="arrow"/>
  <text x="397" y="427" class="small">转换</text>

  <path d="M705 442 L840 442" class="arrow"/>
  <text x="732" y="427" class="small">Agent 调用</text>

  <path d="M950 390 C950 330 640 330 575 291" class="return"/>
  <text x="710" y="346" class="small">工具结果返回给 Agent</text>

  <rect x="110" y="540" width="900" height="48" class="note"/>
  <text x="134" y="570" class="small">关键点：MultiServerMCPClient 不是大模型，也不是 Agent；它是 MCP Server 和 LangChain Agent 之间的工具适配层。</text>
</svg>
