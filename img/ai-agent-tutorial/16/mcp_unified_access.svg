<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <style>
      .title{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:30px;font-weight:700;fill:#222}
      .subtitle{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#59636f}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#2f3742}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;fill:#59636f}
      .box{fill:#fff;stroke:#ccd5e0;stroke-width:2;rx:10}
      .blue{fill:#eef6ff;stroke:#4d92d9}
      .green{fill:#f4fbf3;stroke:#62a765}
      .orange{fill:#fff7ea;stroke:#df9b3f}
      .purple{fill:#f7f5ff;stroke:#7a68d8}
      .gray{fill:#f7f9fb;stroke:#b8c2cc}
      .arrow{stroke:#53616f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8b98a7;stroke-width:2;stroke-dasharray:7 6;fill:none}
      .note{fill:#fff;stroke:#d8dee6;stroke-width:1.5;rx:8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#53616f"/>
    </marker>
  </defs>
  <rect width="1120" height="560" fill="#fbfcfe"/>
  <text x="48" y="58" class="title">MCP 把能力统一接给 Agent</text>
  <text x="48" y="90" class="subtitle">不同 Agent 客户端通过同一套协议连接同一个 MCP Server，不需要为每个客户端重复写适配。</text>

  <rect x="55" y="145" width="205" height="72" class="box blue"/>
  <text x="104" y="177" class="text" font-weight="700">Claude Desktop</text>
  <text x="96" y="202" class="small">一个 Agent 客户端</text>

  <rect x="55" y="245" width="205" height="72" class="box blue"/>
  <text x="130" y="277" class="text" font-weight="700">Cursor</text>
  <text x="96" y="302" class="small">另一个 Agent 客户端</text>

  <rect x="55" y="345" width="205" height="72" class="box blue"/>
  <text x="134" y="377" class="text" font-weight="700">Codex</text>
  <text x="96" y="402" class="small">也能接同一服务</text>

  <rect x="395" y="210" width="260" height="140" class="box green"/>
  <text x="453" y="263" class="text" font-weight="700">MCP Server</text>
  <text x="440" y="292" class="small">统一暴露工具、资源、提示词</text>
  <text x="462" y="318" class="small">像一个 AI 能力适配层</text>

  <rect x="805" y="135" width="220" height="76" class="box orange"/>
  <text x="862" y="168" class="text" font-weight="700">Tools</text>
  <text x="842" y="194" class="small">查课程、查订单、查时间</text>

  <rect x="805" y="242" width="220" height="76" class="box purple"/>
  <text x="842" y="275" class="text" font-weight="700">Resources</text>
  <text x="836" y="301" class="small">读文档、读配置、读资料</text>

  <rect x="805" y="349" width="220" height="76" class="box gray"/>
  <text x="856" y="382" class="text" font-weight="700">Prompts</text>
  <text x="846" y="408" class="small">学习计划、审查模板</text>

  <path d="M260 181 C315 181 335 250 395 250" class="arrow"/>
  <path d="M260 281 L395 281" class="arrow"/>
  <path d="M260 381 C315 381 335 315 395 315" class="arrow"/>

  <path d="M655 250 C715 250 735 173 805 173" class="arrow"/>
  <path d="M655 281 L805 281" class="arrow"/>
  <path d="M655 315 C715 315 735 387 805 387" class="arrow"/>

  <path d="M318 118 L718 118 L718 452 L318 452 Z" class="dash"/>
  <text x="462" y="477" class="small">统一接给 Agent = 客户端按同一套 MCP 协议发现和使用服务端能力</text>

  <rect x="70" y="470" width="320" height="48" class="note"/>
  <text x="92" y="500" class="small">Agent 不是直接连数据库，而是先连 MCP Server。</text>
  <rect x="735" y="470" width="320" height="48" class="note"/>
  <text x="757" y="500" class="small">MCP Server 再去包装真实业务系统能力。</text>
</svg>
