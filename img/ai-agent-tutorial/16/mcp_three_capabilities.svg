<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <style>
      .title{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:30px;font-weight:700;fill:#222}
      .subtitle{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#59636f}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:20px;fill:#2f3742}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;fill:#59636f}
      .box{fill:#fff;stroke:#ccd5e0;stroke-width:2;rx:10}
      .server{fill:#eef6ff;stroke:#4d92d9;stroke-width:2;rx:12}
      .client{fill:#f7f9fb;stroke:#b8c2cc;stroke-width:2;rx:10}
      .tool{fill:#fff7ea;stroke:#df9b3f;stroke-width:2;rx:10}
      .resource{fill:#f7f5ff;stroke:#7a68d8;stroke-width:2;rx:10}
      .prompt{fill:#f4fbf3;stroke:#62a765;stroke-width:2;rx:10}
      .arrow{stroke:#53616f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8b98a7;stroke-width:2;stroke-dasharray:7 6;fill:none}
      .note{fill:#fff;stroke:#d8dee6;stroke-width:1.5;rx:8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#53616f"/>
    </marker>
  </defs>
  <rect width="1120" height="560" fill="#fbfcfe"/>
  <text x="48" y="58" class="title">MCP Server 的三类能力</text>
  <text x="48" y="90" class="subtitle">Tools、Resources、Prompts 是 MCP Server 并列暴露给 Agent 客户端的三类能力。</text>

  <rect x="60" y="205" width="220" height="126" class="client"/>
  <text x="111" y="252" class="text" font-weight="700">Agent 客户端</text>
  <text x="102" y="282" class="small">Claude / Cursor / Codex</text>
  <text x="105" y="306" class="small">发现并使用 MCP 能力</text>

  <rect x="390" y="125" width="650" height="300" class="server"/>
  <text x="610" y="168" class="text" font-weight="700">MCP Server</text>
  <text x="544" y="198" class="small">把三类能力注册成标准 MCP 接口，供 Agent 客户端发现和调用</text>

  <rect x="435" y="245" width="170" height="112" class="tool"/>
  <text x="490" y="286" class="text" font-weight="700">Tools</text>
  <text x="462" y="316" class="small">调用函数，执行动作</text>
  <text x="451" y="340" class="small">query_course(keyword)</text>

  <rect x="630" y="245" width="170" height="112" class="resource"/>
  <text x="668" y="286" class="text" font-weight="700">Resources</text>
  <text x="659" y="316" class="small">按 URI 读取资料</text>
  <text x="655" y="340" class="small">yanque://course/mcp</text>

  <rect x="825" y="245" width="170" height="112" class="prompt"/>
  <text x="865" y="286" class="text" font-weight="700">Prompts</text>
  <text x="855" y="316" class="small">生成提示词模板</text>
  <text x="844" y="340" class="small">course_study_plan</text>

  <path d="M280 250 L390 250" class="arrow"/>
  <path d="M280 286 L390 286" class="arrow"/>
  <text x="300" y="235" class="small">MCP 协议</text>
  <text x="302" y="314" class="small">list / call / read / get</text>

  <path d="M420 222 L1008 222" class="dash"/>
  <text x="473" y="466" class="small">注意：Prompt 不是更高一层，也不是模型本身；它只是 MCP Server 暴露的一种可复用模板能力。</text>

  <rect x="125" y="474" width="870" height="48" class="note"/>
  <text x="148" y="504" class="small">实际项目里，Tools 常接业务 API，Resources 常接文档和配置，Prompts 常接固定工作流模板，三者地位并列。</text>
</svg>
