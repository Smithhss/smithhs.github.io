<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <style>
      .title{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:30px;font-weight:700;fill:#222}
      .subtitle{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#555}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#333}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;fill:#555}
      .code{font-family:Menlo,Consolas,monospace;font-size:15px;fill:#253042}
      .box{fill:#fff;stroke:#ccd5e0;stroke-width:2;rx:10}
      .blue{fill:#eef6ff;stroke:#4d92d9}
      .green{fill:#f4fbf3;stroke:#62a765}
      .orange{fill:#fff7ea;stroke:#df9b3f}
      .purple{fill:#f7f5ff;stroke:#7a68d8}
      .red{fill:#fff1f1;stroke:#d46666}
      .gray{fill:#f8fafc;stroke:#aeb8c4}
      .arrow{stroke:#53616f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#53616f"/>
    </marker>
  </defs>
  <rect width="1180" height="620" fill="#fbfcfe"/>
  <text x="48" y="56" class="title">提示词升级评估流程</text>
  <text x="48" y="88" class="subtitle">先验证本次问题有没有修好，再确认原来正常的能力没有被影响。</text>

  <rect x="55" y="135" width="250" height="115" class="box blue"/>
  <text x="82" y="173" class="text" font-weight="700">1. 明确升级目标</text>
  <text x="82" y="205" class="small">这次到底要修什么</text>
  <text x="82" y="230" class="code">例如：知识库无资料时不编造</text>

  <rect x="380" y="115" width="250" height="95" class="box green"/>
  <text x="407" y="152" class="text" font-weight="700">2A. 本次升级数据</text>
  <text x="407" y="184" class="small">验证新问题是否修好</text>

  <rect x="380" y="240" width="250" height="95" class="box green"/>
  <text x="407" y="277" class="text" font-weight="700">2B. 回归数据</text>
  <text x="407" y="309" class="small">验证旧能力是否受影响</text>

  <rect x="700" y="135" width="220" height="115" class="box orange"/>
  <text x="727" y="173" class="text" font-weight="700">3. 新旧版本回答</text>
  <text x="727" y="205" class="small">同一批问题分别测试</text>
  <text x="727" y="230" class="code">v2 vs v3</text>

  <rect x="55" y="395" width="250" height="125" class="box purple"/>
  <text x="82" y="433" class="text" font-weight="700">4. 程序规则检查</text>
  <text x="82" y="465" class="small">JSON、字段、字数、结构</text>
  <text x="82" y="492" class="small">适合确定性检查</text>

  <rect x="380" y="395" width="250" height="125" class="box purple"/>
  <text x="407" y="433" class="text" font-weight="700">5. 大模型评估</text>
  <text x="407" y="465" class="small">准确性、可理解性、边界</text>
  <text x="407" y="492" class="code">LLM as Judge</text>

  <rect x="700" y="395" width="220" height="125" class="box gray"/>
  <text x="727" y="433" class="text" font-weight="700">6. 人工复查</text>
  <text x="727" y="465" class="small">低分、差异大、高风险</text>
  <text x="727" y="492" class="small">再抽查正常样本</text>

  <rect x="975" y="305" width="160" height="90" class="box green"/>
  <text x="1000" y="340" class="text" font-weight="700">可以发布</text>
  <text x="1000" y="370" class="small">新问题修好</text>
  <text x="1000" y="390" class="small">回归无明显变差</text>

  <rect x="975" y="430" width="160" height="90" class="box red"/>
  <text x="1000" y="465" class="text" font-weight="700">暂不发布</text>
  <text x="1000" y="495" class="small">继续修改</text>
  <text x="1000" y="515" class="small">或回滚旧版本</text>

  <path d="M305 193 L380 162" class="arrow"/>
  <path d="M305 193 L380 288" class="arrow"/>
  <path d="M630 162 C660 162 670 190 700 190" class="arrow"/>
  <path d="M630 288 C660 288 670 225 700 218" class="arrow"/>
  <path d="M810 250 C810 320 180 320 180 395" class="arrow"/>
  <path d="M305 458 L380 458" class="arrow"/>
  <path d="M630 458 L700 458" class="arrow"/>
  <path d="M920 438 C955 420 960 370 975 350" class="arrow"/>
  <path d="M920 475 L975 475" class="arrow"/>
</svg>
