<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">神经网络为什么要分层</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">每一层都在对信息做一次加工，越往后越接近最终判断</text>

  <defs>
    <marker id="arrow-layer" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="190" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">输入层</text>
    <text x="595" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">隐藏层</text>
    <text x="1000" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">输出层</text>

    <rect x="85" y="205" width="210" height="54" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="190" y="239" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">天气</text>
    <rect x="85" y="285" width="210" height="54" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="190" y="319" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">时间</text>
    <rect x="85" y="365" width="210" height="54" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="190" y="399" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">朋友</text>
    <rect x="85" y="445" width="210" height="54" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="190" y="479" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">距离</text>

    <rect x="440" y="235" width="310" height="72" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="595" y="266" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">外部条件</text>
    <text x="595" y="292" text-anchor="middle" font-size="15" fill="#475569">天气和距离是否合适</text>

    <rect x="440" y="390" width="310" height="72" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="595" y="421" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">个人意愿</text>
    <text x="595" y="447" text-anchor="middle" font-size="15" fill="#475569">时间和朋友是否支持</text>

    <rect x="870" y="300" width="260" height="92" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1000" y="337" text-anchor="middle" font-size="21" font-weight="700" fill="#047857">最终判断</text>
    <text x="1000" y="368" text-anchor="middle" font-size="17" fill="#334155">适合 / 不适合</text>

    <line x1="295" y1="232" x2="425" y2="258" stroke="#475569" stroke-width="3" marker-end="url(#arrow-layer)"/>
    <line x1="295" y1="472" x2="425" y2="292" stroke="#475569" stroke-width="3" marker-end="url(#arrow-layer)"/>
    <line x1="295" y1="312" x2="425" y2="408" stroke="#475569" stroke-width="3" marker-end="url(#arrow-layer)"/>
    <line x1="295" y1="392" x2="425" y2="438" stroke="#475569" stroke-width="3" marker-end="url(#arrow-layer)"/>

    <line x1="755" y1="271" x2="855" y2="330" stroke="#475569" stroke-width="3" marker-end="url(#arrow-layer)"/>
    <line x1="755" y1="426" x2="855" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#arrow-layer)"/>

    <rect x="220" y="555" width="760" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="588" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">隐藏层不是直接给答案，而是先提取中间特征，再交给后面继续判断</text>
  </g>
</svg>
