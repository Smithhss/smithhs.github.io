<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">神经网络的基本结构</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">圆点可以理解成神经元，连线可以理解成带权重的信息连接</text>

  <defs>
    <marker id="arrow-nn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="180" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">输入层</text>
    <text x="600" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">隐藏层</text>
    <text x="1020" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">输出层</text>

    <g fill="#ede9fe" stroke="#a78bfa" stroke-width="2">
      <circle cx="180" cy="230" r="28"/>
      <circle cx="180" cy="310" r="28"/>
      <circle cx="180" cy="390" r="28"/>
      <circle cx="180" cy="470" r="28"/>
    </g>
    <g fill="#eff6ff" stroke="#60a5fa" stroke-width="2">
      <circle cx="500" cy="235" r="28"/>
      <circle cx="500" cy="325" r="28"/>
      <circle cx="500" cy="415" r="28"/>
      <circle cx="700" cy="275" r="28"/>
      <circle cx="700" cy="365" r="28"/>
      <circle cx="700" cy="455" r="28"/>
    </g>
    <g fill="#ecfdf5" stroke="#34d399" stroke-width="2">
      <circle cx="1020" cy="310" r="30"/>
      <circle cx="1020" cy="410" r="30"/>
    </g>

    <g stroke="#94a3b8" stroke-width="2" opacity="0.85">
      <line x1="208" y1="230" x2="472" y2="235"/>
      <line x1="208" y1="230" x2="472" y2="325"/>
      <line x1="208" y1="310" x2="472" y2="235"/>
      <line x1="208" y1="310" x2="472" y2="325"/>
      <line x1="208" y1="310" x2="472" y2="415"/>
      <line x1="208" y1="390" x2="472" y2="325"/>
      <line x1="208" y1="390" x2="472" y2="415"/>
      <line x1="208" y1="470" x2="472" y2="415"/>

      <line x1="528" y1="235" x2="672" y2="275"/>
      <line x1="528" y1="235" x2="672" y2="365"/>
      <line x1="528" y1="325" x2="672" y2="275"/>
      <line x1="528" y1="325" x2="672" y2="365"/>
      <line x1="528" y1="415" x2="672" y2="365"/>
      <line x1="528" y1="415" x2="672" y2="455"/>

      <line x1="728" y1="275" x2="990" y2="310"/>
      <line x1="728" y1="365" x2="990" y2="310"/>
      <line x1="728" y1="365" x2="990" y2="410"/>
      <line x1="728" y1="455" x2="990" y2="410"/>
    </g>

    <text x="180" y="555" text-anchor="middle" font-size="17" fill="#475569">接收信息</text>
    <text x="600" y="555" text-anchor="middle" font-size="17" fill="#475569">每个圆点做一次小计算</text>
    <text x="1020" y="555" text-anchor="middle" font-size="17" fill="#475569">得到输出结果</text>

    <rect x="360" y="185" width="155" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="438" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">圆点 = 神经元</text>

    <rect x="735" y="185" width="180" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="825" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">连线 = 权重连接</text>

    <rect x="230" y="600" width="740" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="631" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">大模型就是更大、更深、更复杂的神经网络</text>
  </g>
</svg>
