<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">模型参数是怎么学出来的</text>
  <text x="640" y="124" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">训练就是前向预测、计算损失、反向找原因、更新参数</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CBD5E1" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="58" y="220" width="190" height="112" rx="18" fill="#EEF2FF" stroke="#818CF8" stroke-width="3" filter="url(#shadow)"/>
  <text x="153" y="266" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#3730A3">训练样本</text>
  <text x="153" y="302" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">输入 + 标准答案</text>

  <rect x="292" y="220" width="190" height="112" rx="18" fill="#ECFEFF" stroke="#06B6D4" stroke-width="3" filter="url(#shadow)"/>
  <text x="387" y="262" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0E7490">前向传播</text>
  <text x="387" y="300" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">先预测结果</text>

  <rect x="526" y="220" width="190" height="112" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="3" filter="url(#shadow)"/>
  <text x="621" y="262" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#C2410C">损失函数</text>
  <text x="621" y="300" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">计算错多少</text>

  <rect x="760" y="220" width="190" height="112" rx="18" fill="#FDF2F8" stroke="#F472B6" stroke-width="3" filter="url(#shadow)"/>
  <text x="855" y="262" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#BE185D">反向传播</text>
  <text x="855" y="300" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">找出谁影响错误</text>

  <rect x="994" y="220" width="220" height="112" rx="18" fill="#F0FDF4" stroke="#22C55E" stroke-width="3" filter="url(#shadow)"/>
  <text x="1104" y="262" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#15803D">梯度下降</text>
  <text x="1104" y="300" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">按学习率更新参数</text>

  <path d="M248 276H276" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M482 276H510" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M716 276H744" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M950 276H978" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1104 342V442C1104 486 1068 522 1024 522H233C189 522 153 486 153 442V348" stroke="#64748B" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="640" y="562" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#334155">这个过程会重复非常多次</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#64748B">参数不是手写出来的，而是在大量样本中慢慢调出来的</text>
</svg>
