<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">导数告诉我们往哪里走</text>
  <text x="640" y="114" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">梯度下降就是沿着让损失下降的方向，一步一步更新参数</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CBD5E1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="70" y="156" width="526" height="470" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="333" y="202" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#334155">1. 一个参数：看导数</text>
  <line x1="132" y1="550" x2="532" y2="550" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="132" y1="550" x2="132" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="540" y="580" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#475569">参数 x</text>
  <text x="88" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#475569">损失</text>

  <path d="M158 512C202 400 254 320 318 300C382 280 446 372 510 520" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
  <path d="M158 512C202 400 254 320 318 300C382 280 446 372 510 520" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="226" cy="374" r="8" fill="#2563EB"/>
  <circle cx="430" cy="420" r="8" fill="#DC2626"/>
  <path d="M226 374L270 340" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M430 420L386 354" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="170" y="444" width="346" height="82" rx="14" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="343" y="476" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#3730A3">导数 f'(x) 表示当前斜率</text>
  <text x="343" y="507" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">斜率为正，往左更低；斜率为负，往右更低</text>

  <rect x="684" y="156" width="526" height="470" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="202" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#334155">2. 多个参数：看偏导数</text>
  <line x1="746" y1="550" x2="1148" y2="550" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="746" y1="550" x2="746" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1140" y="580" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#475569">参数 k、b</text>
  <text x="702" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#475569">MSE</text>

  <path d="M790 490C835 396 890 352 946 394C1001 436 1036 330 1096 286" stroke="#CBD5E1" stroke-width="72" stroke-linecap="round"/>
  <path d="M790 490C835 396 890 352 946 394C1001 436 1036 330 1096 286" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1088" cy="292" r="8" fill="#F97316"/>
  <circle cx="1018" cy="367" r="8" fill="#F59E0B"/>
  <circle cx="944" cy="394" r="8" fill="#84CC16"/>
  <circle cx="868" cy="370" r="8" fill="#22C55E"/>
  <path d="M1084 300L1026 360" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1008 372L954 392" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M934 390L878 374" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="762" y="226" width="390" height="94" rx="14" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="957" y="260" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#166534">k_new = k - α × ∂Loss/∂k</text>
  <text x="957" y="292" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#166534">b_new = b - α × ∂Loss/∂b</text>

  <rect x="802" y="444" width="322" height="78" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="963" y="475" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#C2410C">偏导数：只看某一个参数的影响</text>
  <text x="963" y="504" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#475569">分别判断 k 和 b 应该怎么调</text>
</svg>
