<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#111827">一个神经元里面到底算了什么</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#64748b">输入先乘以权重，再求和，最后经过激活函数得到输出</text>

  <defs>
    <marker id="arrow-formula" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#cbd5e1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="172" width="222" height="250" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="3" filter="url(#shadow)"/>
    <text x="181" y="216" text-anchor="middle" font-size="25" font-weight="700" fill="#3730a3">输入 x</text>
    <text x="181" y="270" text-anchor="middle" font-size="22" fill="#334155">x1：天气</text>
    <text x="181" y="320" text-anchor="middle" font-size="22" fill="#334155">x2：时间</text>
    <text x="181" y="370" text-anchor="middle" font-size="22" fill="#334155">x3：朋友</text>

    <rect x="358" y="172" width="222" height="250" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
    <text x="469" y="216" text-anchor="middle" font-size="25" font-weight="700" fill="#0e7490">权重 w</text>
    <text x="469" y="270" text-anchor="middle" font-size="22" fill="#334155">w1：天气权重</text>
    <text x="469" y="320" text-anchor="middle" font-size="22" fill="#334155">w2：时间权重</text>
    <text x="469" y="370" text-anchor="middle" font-size="22" fill="#334155">w3：朋友权重</text>

    <rect x="646" y="172" width="270" height="250" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
    <text x="781" y="216" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">加权求和</text>
    <text x="781" y="280" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">z = x1w1 + x2w2</text>
    <text x="781" y="318" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">+ x3w3 + b</text>
    <text x="781" y="370" text-anchor="middle" font-size="18" fill="#64748b">b 是偏置，可以理解成基础倾向</text>

    <rect x="982" y="172" width="160" height="250" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
    <text x="1062" y="216" text-anchor="middle" font-size="25" font-weight="700" fill="#15803d">激活函数</text>
    <text x="1062" y="292" text-anchor="middle" font-size="22" fill="#334155">把 z 变成</text>
    <text x="1062" y="330" text-anchor="middle" font-size="22" fill="#334155">最终输出</text>

    <line x1="292" y1="297" x2="342" y2="297" stroke="#475569" stroke-width="4" marker-end="url(#arrow-formula)"/>
    <line x1="580" y1="297" x2="630" y2="297" stroke="#475569" stroke-width="4" marker-end="url(#arrow-formula)"/>
    <line x1="916" y1="297" x2="966" y2="297" stroke="#475569" stroke-width="4" marker-end="url(#arrow-formula)"/>

    <rect x="168" y="486" width="864" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="523" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">输入 × 权重 → 求和 → 激活函数，这就是神经元最基本的计算方式</text>
  </g>
</svg>
