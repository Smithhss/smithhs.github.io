<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">大模型是一步一步生成内容的</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">每生成一个片段，新片段又会成为后续生成的上下文</text>

  <defs>
    <marker id="arrow-token" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="90" y="155" width="1020" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">输入：什么是 AIGC？</text>

    <rect x="130" y="300" width="150" height="74" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="205" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">AIGC</text>

    <rect x="350" y="300" width="150" height="74" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="425" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">是</text>

    <rect x="570" y="300" width="190" height="74" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="665" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">人工智能</text>

    <rect x="830" y="300" width="240" height="74" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="950" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c2410c">生成内容...</text>

    <line x1="285" y1="337" x2="335" y2="337" stroke="#475569" stroke-width="3" marker-end="url(#arrow-token)"/>
    <line x1="505" y1="337" x2="555" y2="337" stroke="#475569" stroke-width="3" marker-end="url(#arrow-token)"/>
    <line x1="765" y1="337" x2="815" y2="337" stroke="#475569" stroke-width="3" marker-end="url(#arrow-token)"/>

    <rect x="205" y="440" width="790" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="476" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">核心：根据已有上下文，预测并生成下一个更合适的 Token</text>
  </g>
</svg>
