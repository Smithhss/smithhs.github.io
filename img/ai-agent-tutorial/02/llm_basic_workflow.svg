<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">大模型的基本工作方式</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">不是简单查答案，而是根据输入和上下文一步一步生成内容</text>

  <defs>
    <marker id="arrow-llm" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="170" width="260" height="210" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="200" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#6d28d9">输入内容</text>
    <text x="200" y="255" text-anchor="middle" font-size="16" fill="#475569">用户问题</text>
    <text x="200" y="285" text-anchor="middle" font-size="16" fill="#475569">Prompt 要求</text>
    <text x="200" y="315" text-anchor="middle" font-size="16" fill="#475569">历史对话</text>
    <text x="200" y="345" text-anchor="middle" font-size="16" fill="#475569">表结构 / 资料片段</text>

    <rect x="470" y="145" width="260" height="260" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="600" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#1d4ed8">大模型</text>
    <text x="600" y="250" text-anchor="middle" font-size="17" fill="#334155">经过大量数据训练</text>
    <text x="600" y="282" text-anchor="middle" font-size="17" fill="#334155">内部包含大量参数</text>
    <text x="600" y="314" text-anchor="middle" font-size="17" fill="#334155">根据上下文生成</text>
    <text x="600" y="346" text-anchor="middle" font-size="17" fill="#334155">下一个 Token</text>

    <rect x="870" y="170" width="260" height="210" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1000" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">生成内容</text>
    <text x="1000" y="255" text-anchor="middle" font-size="16" fill="#475569">回答</text>
    <text x="1000" y="285" text-anchor="middle" font-size="16" fill="#475569">SQL</text>
    <text x="1000" y="315" text-anchor="middle" font-size="16" fill="#475569">代码 / JSON</text>
    <text x="1000" y="345" text-anchor="middle" font-size="16" fill="#475569">总结 / 分析结论</text>

    <line x1="335" y1="275" x2="455" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow-llm)"/>
    <line x1="735" y1="275" x2="855" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow-llm)"/>

    <rect x="135" y="485" width="930" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">先建立边界</text>
    <text x="600" y="552" text-anchor="middle" font-size="17" fill="#475569">数据库负责查已有数据，搜索引擎负责找已有资料，大模型负责根据上下文生成内容</text>
  </g>
</svg>
