<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">AIGC、 大模型与工程项目的关系</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">AIGC 是看得见的现象，大模型提供生成能力，工程系统负责让能力可靠落地</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="80" y="170" width="260" height="210" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="210" y="216" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">AIGC</text>
    <text x="210" y="258" text-anchor="middle" font-size="17" fill="#334155">AI 生成内容</text>
    <text x="210" y="292" text-anchor="middle" font-size="16" fill="#475569">文本 / 代码 / SQL</text>
    <text x="210" y="322" text-anchor="middle" font-size="16" fill="#475569">JSON / 报告 / 图片</text>

    <rect x="470" y="150" width="260" height="250" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="600" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">大模型</text>
    <text x="600" y="248" text-anchor="middle" font-size="17" fill="#334155">生成能力来源</text>
    <text x="600" y="282" text-anchor="middle" font-size="16" fill="#475569">理解上下文</text>
    <text x="600" y="312" text-anchor="middle" font-size="16" fill="#475569">预测后续内容</text>
    <text x="600" y="342" text-anchor="middle" font-size="16" fill="#475569">按要求组织输出</text>

    <rect x="860" y="170" width="260" height="210" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="990" y="216" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">工程系统</text>
    <text x="990" y="258" text-anchor="middle" font-size="17" fill="#334155">让能力可靠落地</text>
    <text x="990" y="292" text-anchor="middle" font-size="16" fill="#475569">鉴权 / 校验 / 数据</text>
    <text x="990" y="322" text-anchor="middle" font-size="16" fill="#475569">日志 / 权限 / 审核</text>

    <line x1="350" y1="275" x2="455" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="740" y1="275" x2="845" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="170" y="455" width="860" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="497" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">关键关系：AIGC 负责生成内容，大模型提供能力，工程系统保证可靠落地</text>
  </g>
</svg>
