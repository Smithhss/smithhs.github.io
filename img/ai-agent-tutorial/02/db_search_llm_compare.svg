<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">数据库、搜索引擎和大模型的区别</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">三者经常组合使用，但核心能力不同</text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="80" y="165" width="300" height="285" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="230" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">数据库</text>
    <text x="230" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">查已有数据</text>
    <text x="230" y="305" text-anchor="middle" font-size="16" fill="#475569">订单记录</text>
    <text x="230" y="335" text-anchor="middle" font-size="16" fill="#475569">学生信息</text>
    <text x="230" y="365" text-anchor="middle" font-size="16" fill="#475569">课程数据</text>
    <text x="230" y="410" text-anchor="middle" font-size="17" fill="#334155">返回表里的记录</text>

    <rect x="450" y="165" width="300" height="285" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="600" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">搜索引擎</text>
    <text x="600" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">找已有资料</text>
    <text x="600" y="305" text-anchor="middle" font-size="16" fill="#475569">网页</text>
    <text x="600" y="335" text-anchor="middle" font-size="16" fill="#475569">文档</text>
    <text x="600" y="365" text-anchor="middle" font-size="16" fill="#475569">链接和摘要</text>
    <text x="600" y="410" text-anchor="middle" font-size="17" fill="#334155">返回相关资料</text>

    <rect x="820" y="165" width="300" height="285" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="970" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">大模型</text>
    <text x="970" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">根据上下文生成</text>
    <text x="970" y="305" text-anchor="middle" font-size="16" fill="#475569">回答</text>
    <text x="970" y="335" text-anchor="middle" font-size="16" fill="#475569">SQL / 代码</text>
    <text x="970" y="365" text-anchor="middle" font-size="16" fill="#475569">JSON / 总结</text>
    <text x="970" y="410" text-anchor="middle" font-size="17" fill="#334155">返回新生成内容</text>

    <rect x="185" y="505" width="830" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="541" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">真实 AI 应用常见组合：先查数据或资料，再让大模型生成回答</text>
  </g>
</svg>
