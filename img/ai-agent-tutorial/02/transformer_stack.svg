<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">Transformer：多层处理上下文关系</text>
  <text x="640" y="114" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748b">每一层都会重新整理 Token 之间的关系，让语义越来越清楚</text>

  <defs>
    <marker id="arrow-stack" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#cbd5e1" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="80" y="250" width="210" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="185" y="298" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">Embedding 向量</text>
    <rect x="112" y="330" width="146" height="48" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="185" y="361" text-anchor="middle" font-size="19" fill="#1d4ed8">Token 的数字表示</text>

    <line x1="290" y1="335" x2="360" y2="335" stroke="#475569" stroke-width="4" marker-end="url(#arrow-stack)"/>

    <rect x="380" y="178" width="230" height="314" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="3" filter="url(#shadow)"/>
    <text x="495" y="230" text-anchor="middle" font-size="27" font-weight="700" fill="#3730a3">Transformer 第 1 层</text>
    <rect x="415" y="268" width="160" height="58" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="495" y="304" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">注意力</text>
    <rect x="415" y="356" width="160" height="58" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="495" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">神经网络</text>

    <line x1="610" y1="335" x2="680" y2="335" stroke="#475569" stroke-width="4" marker-end="url(#arrow-stack)"/>

    <rect x="700" y="178" width="230" height="314" rx="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
    <text x="815" y="230" text-anchor="middle" font-size="27" font-weight="700" fill="#0e7490">Transformer 第 2 层</text>
    <rect x="735" y="268" width="160" height="58" rx="14" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="815" y="304" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">注意力</text>
    <rect x="735" y="356" width="160" height="58" rx="14" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="815" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">神经网络</text>

    <line x1="930" y1="335" x2="1000" y2="335" stroke="#475569" stroke-width="4" marker-end="url(#arrow-stack)"/>

    <rect x="1020" y="250" width="210" height="170" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1125" y="298" text-anchor="middle" font-size="25" font-weight="700" fill="#15803d">输出结果</text>
    <rect x="1052" y="330" width="146" height="48" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="1125" y="361" text-anchor="middle" font-size="19" fill="#166534">预测下一个 Token</text>

    <rect x="206" y="585" width="868" height="58" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="640" y="622" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">大模型就是很多很多层 Transformer 叠起来，再经过大量数据训练出来的</text>
  </g>
</svg>
