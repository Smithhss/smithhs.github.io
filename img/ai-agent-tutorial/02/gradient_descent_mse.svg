<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">用 MSE 理解梯度下降</text>
  <text x="640" y="112" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">调整参数 k 和 b，让预测线离真实数据越来越近</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CBD5E1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="60" y="154" width="540" height="466" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="200" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#334155">1. 一条预测线会产生误差</text>

  <line x1="122" y1="545" x2="540" y2="545" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="122" y1="545" x2="122" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="550" y="573" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">面积 x</text>
  <text x="72" y="250" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">价格 y</text>

  <line x1="150" y1="500" x2="515" y2="275" stroke="#2563EB" stroke-width="4"/>
  <text x="407" y="292" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#2563EB">ŷ = kx + b</text>

  <circle cx="180" cy="466" r="6" fill="#111827"/>
  <circle cx="250" cy="395" r="6" fill="#111827"/>
  <circle cx="320" cy="432" r="6" fill="#111827"/>
  <circle cx="390" cy="326" r="6" fill="#111827"/>
  <circle cx="470" cy="302" r="6" fill="#111827"/>

  <line x1="180" y1="466" x2="180" y2="482" stroke="#EF4444" stroke-width="3"/>
  <line x1="250" y1="395" x2="250" y2="438" stroke="#EF4444" stroke-width="3"/>
  <line x1="320" y1="432" x2="320" y2="395" stroke="#EF4444" stroke-width="3"/>
  <line x1="390" y1="326" x2="390" y2="352" stroke="#EF4444" stroke-width="3"/>
  <line x1="470" y1="302" x2="470" y2="323" stroke="#EF4444" stroke-width="3"/>
  <text x="236" y="586" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#DC2626">红线：真实值 y 和预测值 ŷ 的差距</text>

  <rect x="160" y="216" width="330" height="58" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="325" y="252" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#334155">MSE = 平均[(y - ŷ)²]</text>

  <rect x="680" y="154" width="540" height="466" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="200" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#334155">2. 在参数地形里往低处走</text>

  <path d="M770 488C815 385 870 322 936 334C999 345 1026 432 1086 370C1119 336 1147 306 1172 284" stroke="#CBD5E1" stroke-width="70" stroke-linecap="round"/>
  <path d="M770 488C815 385 870 322 936 334C999 345 1026 432 1086 370C1119 336 1147 306 1172 284" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <path d="M1140 292C1108 318 1080 346 1051 374C1012 424 976 398 942 357C900 307 853 345 818 397C800 424 783 459 770 488" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 8"/>

  <circle cx="1140" cy="292" r="8" fill="#DC2626"/>
  <circle cx="1084" cy="371" r="8" fill="#F97316"/>
  <circle cx="1018" cy="407" r="8" fill="#F59E0B"/>
  <circle cx="943" cy="357" r="8" fill="#84CC16"/>
  <circle cx="878" cy="330" r="8" fill="#22C55E"/>

  <path d="M1135 300L1090 362" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1075 378L1028 402" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1007 404L953 364" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M932 352L888 334" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="738" y1="545" x2="1168" y2="545" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="738" y1="545" x2="738" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1164" y="574" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">参数 k、b</text>
  <text x="696" y="250" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">MSE</text>

  <rect x="760" y="232" width="404" height="78" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="962" y="263" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#166534">新参数 = 旧参数 - 学习率 × 梯度</text>
  <text x="962" y="292" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#475569">每次沿着让 MSE 下降的方向走一小步</text>
</svg>
