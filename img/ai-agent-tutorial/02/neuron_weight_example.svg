<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">用“是否适合打篮球”理解神经元和权重</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">神经元会综合多个输入，权重表示每个输入有多重要</text>

  <defs>
    <marker id="arrow-neuron" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="95" y="155" width="250" height="68" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="220" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">天气适合</text>
    <text x="365" y="198" font-size="16" fill="#64748b">权重</text>

    <rect x="95" y="255" width="250" height="68" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="220" y="298" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">有时间</text>
    <text x="365" y="298" font-size="16" fill="#64748b">权重</text>

    <rect x="95" y="355" width="250" height="68" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="220" y="398" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">有朋友一起</text>
    <text x="365" y="398" font-size="16" fill="#64748b">权重</text>

    <rect x="95" y="455" width="250" height="68" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="220" y="498" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">球场不远</text>
    <text x="365" y="498" font-size="16" fill="#64748b">权重</text>

    <circle cx="600" cy="340" r="86" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="600" y="328" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">神经元</text>
    <text x="600" y="365" text-anchor="middle" font-size="17" fill="#475569">综合计算</text>

    <rect x="840" y="290" width="270" height="100" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="975" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#047857">输出结果</text>
    <text x="975" y="365" text-anchor="middle" font-size="18" fill="#334155">适合 / 不适合</text>

    <line x1="345" y1="189" x2="520" y2="298" stroke="#475569" stroke-width="3" marker-end="url(#arrow-neuron)"/>
    <line x1="345" y1="289" x2="510" y2="325" stroke="#475569" stroke-width="3" marker-end="url(#arrow-neuron)"/>
    <line x1="345" y1="389" x2="510" y2="355" stroke="#475569" stroke-width="3" marker-end="url(#arrow-neuron)"/>
    <line x1="345" y1="489" x2="520" y2="382" stroke="#475569" stroke-width="3" marker-end="url(#arrow-neuron)"/>
    <line x1="686" y1="340" x2="825" y2="340" stroke="#475569" stroke-width="3" marker-end="url(#arrow-neuron)"/>

    <rect x="180" y="570" width="840" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="600" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">权重不同，代表模型对不同输入的重视程度不同</text>
  </g>
</svg>
