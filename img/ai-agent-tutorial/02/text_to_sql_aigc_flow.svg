<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#172033">Text-to-SQL 中的 AIGC 流程</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b">AI 生成的内容不一定是文章，也可以是系统下一步要执行的 SQL</text>

  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="160" width="190" height="105" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="165" y="200" text-anchor="middle" font-size="21" font-weight="700" fill="#6d28d9">自然语言问题</text>
    <text x="165" y="233" text-anchor="middle" font-size="15" fill="#475569">最近 7 天</text>
    <text x="165" y="255" text-anchor="middle" font-size="15" fill="#475569">每个课程报名人数</text>

    <rect x="320" y="160" width="190" height="105" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="415" y="200" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">大模型生成</text>
    <text x="415" y="235" text-anchor="middle" font-size="16" fill="#475569">SQL 查询语句</text>

    <rect x="570" y="160" width="190" height="105" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="665" y="200" text-anchor="middle" font-size="21" font-weight="700" fill="#c2410c">安全校验</text>
    <text x="665" y="233" text-anchor="middle" font-size="15" fill="#475569">只允许查询</text>
    <text x="665" y="255" text-anchor="middle" font-size="15" fill="#475569">限制表和字段</text>

    <rect x="820" y="160" width="190" height="105" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="915" y="200" text-anchor="middle" font-size="21" font-weight="700" fill="#047857">数据库执行</text>
    <text x="915" y="235" text-anchor="middle" font-size="16" fill="#475569">返回查询结果</text>

    <line x1="265" y1="212" x2="305" y2="212" stroke="#475569" stroke-width="3" marker-end="url(#arrow2)"/>
    <line x1="515" y1="212" x2="555" y2="212" stroke="#475569" stroke-width="3" marker-end="url(#arrow2)"/>
    <line x1="765" y1="212" x2="805" y2="212" stroke="#475569" stroke-width="3" marker-end="url(#arrow2)"/>

    <path d="M915 270 C915 335, 650 335, 650 395" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow2)"/>

    <rect x="440" y="395" width="420" height="115" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="650" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">大模型再次生成</text>
    <text x="650" y="475" text-anchor="middle" font-size="16" fill="#475569">把查询结果解释成业务结论</text>

    <rect x="250" y="545" width="700" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="579" text-anchor="middle" font-size="18" fill="#334155">AIGC 在这里出现两次：生成 SQL，生成分析结论</text>

    <path d="M650 515 C650 528, 600 528, 600 540" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow2)"/>
  </g>
</svg>
