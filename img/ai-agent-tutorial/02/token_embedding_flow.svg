<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">文字进入大模型前，会先变成向量</text>
  <text x="640" y="114" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748b">模型真正计算的不是文字本身，而是一组组数字</text>

  <defs>
    <marker id="arrow-token" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#cbd5e1" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="220" width="210" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="175" y="262" text-anchor="middle" font-size="26" font-weight="700" fill="#334155">原始文字</text>
    <rect x="98" y="302" width="154" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="175" y="337" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">我喜欢人工智能</text>

    <line x1="280" y1="310" x2="365" y2="310" stroke="#475569" stroke-width="4" marker-end="url(#arrow-token)"/>

    <rect x="380" y="190" width="250" height="240" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="505" y="236" text-anchor="middle" font-size="26" font-weight="700" fill="#3730a3">Token</text>
    <text x="505" y="270" text-anchor="middle" font-size="18" fill="#475569">先切成模型处理的小块</text>
    <rect x="415" y="302" width="70" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="450" y="329" text-anchor="middle" font-size="20" fill="#334155">我</text>
    <rect x="495" y="302" width="70" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="530" y="329" text-anchor="middle" font-size="20" fill="#334155">喜欢</text>
    <rect x="415" y="358" width="150" height="42" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="490" y="385" text-anchor="middle" font-size="20" fill="#334155">人工智能</text>

    <line x1="630" y1="310" x2="715" y2="310" stroke="#475569" stroke-width="4" marker-end="url(#arrow-token)"/>

    <rect x="730" y="190" width="220" height="240" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="840" y="236" text-anchor="middle" font-size="26" font-weight="700" fill="#0e7490">Token ID</text>
    <text x="840" y="270" text-anchor="middle" font-size="18" fill="#475569">每个 Token 的编号</text>
    <rect x="768" y="302" width="56" height="42" rx="10" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="796" y="329" text-anchor="middle" font-size="19" fill="#334155">102</text>
    <rect x="835" y="302" width="56" height="42" rx="10" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="863" y="329" text-anchor="middle" font-size="19" fill="#334155">381</text>
    <rect x="802" y="358" width="76" height="42" rx="10" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="840" y="385" text-anchor="middle" font-size="19" fill="#334155">9284</text>

    <line x1="950" y1="310" x2="1035" y2="310" stroke="#475569" stroke-width="4" marker-end="url(#arrow-token)"/>

    <rect x="1050" y="190" width="190" height="240" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1145" y="236" text-anchor="middle" font-size="26" font-weight="700" fill="#15803d">Embedding</text>
    <text x="1145" y="270" text-anchor="middle" font-size="18" fill="#475569">变成语义向量</text>
    <rect x="1082" y="304" width="126" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="1145" y="333" text-anchor="middle" font-size="18" fill="#334155">[0.21, -0.08,</text>
    <text x="1145" y="362" text-anchor="middle" font-size="18" fill="#334155">0.64, 0.12,</text>
    <text x="1145" y="391" text-anchor="middle" font-size="18" fill="#334155">...]</text>

    <rect x="180" y="540" width="920" height="58" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="640" y="577" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">下一步，Transformer 会处理这些向量，并判断它们之间的上下文关系</text>
  </g>
</svg>
