<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">大模型一次回答的大致流程</text>
  <text x="640" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748b">把今天学到的概念串成一条完整链路</text>

  <defs>
    <marker id="arrow-end" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#cbd5e1" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="58" y="238" width="138" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="127" y="282" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">用户输入</text>
    <text x="127" y="315" text-anchor="middle" font-size="17" fill="#64748b">问题 / Prompt</text>

    <line x1="196" y1="293" x2="252" y2="293" stroke="#475569" stroke-width="4" marker-end="url(#arrow-end)"/>

    <rect x="270" y="238" width="128" height="110" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="3" filter="url(#shadow)"/>
    <text x="334" y="282" text-anchor="middle" font-size="23" font-weight="700" fill="#3730a3">Token</text>
    <text x="334" y="315" text-anchor="middle" font-size="17" fill="#64748b">切成小块</text>

    <line x1="398" y1="293" x2="454" y2="293" stroke="#475569" stroke-width="4" marker-end="url(#arrow-end)"/>

    <rect x="472" y="238" width="150" height="110" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
    <text x="547" y="282" text-anchor="middle" font-size="23" font-weight="700" fill="#0e7490">Embedding</text>
    <text x="547" y="315" text-anchor="middle" font-size="17" fill="#64748b">变成向量</text>

    <line x1="622" y1="293" x2="678" y2="293" stroke="#475569" stroke-width="4" marker-end="url(#arrow-end)"/>

    <rect x="696" y="210" width="170" height="166" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
    <text x="781" y="258" text-anchor="middle" font-size="24" font-weight="700" fill="#6d28d9">Transformer</text>
    <text x="781" y="294" text-anchor="middle" font-size="17" fill="#475569">理解上下文</text>
    <text x="781" y="323" text-anchor="middle" font-size="17" fill="#475569">处理关系</text>

    <line x1="866" y1="293" x2="922" y2="293" stroke="#475569" stroke-width="4" marker-end="url(#arrow-end)"/>

    <rect x="940" y="238" width="142" height="110" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
    <text x="1011" y="282" text-anchor="middle" font-size="23" font-weight="700" fill="#15803d">预测</text>
    <text x="1011" y="315" text-anchor="middle" font-size="17" fill="#64748b">下一个 Token</text>

    <line x1="1082" y1="293" x2="1138" y2="293" stroke="#475569" stroke-width="4" marker-end="url(#arrow-end)"/>

    <rect x="1156" y="238" width="94" height="110" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
    <text x="1203" y="282" text-anchor="middle" font-size="23" font-weight="700" fill="#c2410c">回答</text>
    <text x="1203" y="315" text-anchor="middle" font-size="17" fill="#64748b">逐步生成</text>

    <path d="M1010 348 C1010 448, 334 448, 334 360" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-end)"/>
    <text x="670" y="430" text-anchor="middle" font-size="20" fill="#64748b">生成一个 Token 后，会继续拿着前文预测下一个</text>

    <rect x="178" y="530" width="924" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="640" y="562" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">接入项目系统后</text>
    <text x="640" y="596" text-anchor="middle" font-size="20" fill="#475569">程序通过 API 调用模型，把生成结果用于问答、Text-to-SQL、资料分析或业务流程</text>
  </g>
</svg>
