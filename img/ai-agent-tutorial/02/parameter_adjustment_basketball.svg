<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">预测错了以后，参数怎么调整</text>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">以“球场很远却被判断适合”为例</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#64748B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CBD5E1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="96" y="180" width="292" height="358" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="242" y="224" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#334155">输入信息</text>
  <rect x="132" y="258" width="220" height="48" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="242" y="290" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#3730A3">天气好</text>
  <rect x="132" y="324" width="220" height="48" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="242" y="356" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#3730A3">有时间</text>
  <rect x="132" y="390" width="220" height="48" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="242" y="422" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#3730A3">有朋友</text>
  <rect x="132" y="456" width="220" height="48" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="242" y="488" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#B91C1C">球场很远</text>

  <rect x="494" y="180" width="292" height="358" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="224" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#334155">模型当前判断</text>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748B">当前参数更重视</text>
  <text x="640" y="312" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#2563EB">天气、时间、朋友</text>
  <text x="640" y="358" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748B">没有足够重视</text>
  <text x="640" y="398" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#DC2626">距离很远</text>
  <rect x="548" y="444" width="184" height="56" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="640" y="480" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#92400E">预测：适合</text>

  <rect x="892" y="180" width="292" height="358" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1038" y="224" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#334155">对答案后调整</text>
  <text x="1038" y="272" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748B">标准答案：</text>
  <rect x="946" y="292" width="184" height="56" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="1038" y="328" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#B91C1C">不适合</text>
  <text x="1038" y="392" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#15803D">调大“距离远”的影响</text>
  <text x="1038" y="430" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#15803D">调小错误判断的影响</text>
  <text x="1038" y="480" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748B">下次遇到类似情况</text>
  <text x="1038" y="512" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748B">更容易判断为不适合</text>

  <path d="M388 358H476" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M786 358H874" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="262" y="592" width="756" height="62" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="640" y="632" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700" fill="#334155">反向传播负责找原因，梯度下降负责微调参数</text>
</svg>
