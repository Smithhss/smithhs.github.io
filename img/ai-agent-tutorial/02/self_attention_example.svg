<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#111827">注意力机制：当前 Token 应该重点看谁</text>
  <text x="640" y="114" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748b">同一句话里，不同 Token 之间的关系强弱不一样</text>

  <defs>
    <marker id="arrow-attn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#cbd5e1" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="95" y="178" width="1090" height="410" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>

    <text x="640" y="236" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">小明 把 书 放进 书包，因为 它 太重了。</text>

    <rect x="235" y="325" width="96" height="62" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <text x="283" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">小明</text>

    <rect x="370" y="325" width="78" height="62" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <text x="409" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">把</text>

    <rect x="488" y="325" width="78" height="62" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
    <text x="527" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">书</text>

    <rect x="606" y="325" width="92" height="62" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <text x="652" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">放进</text>

    <rect x="738" y="325" width="108" height="62" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="792" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">书包</text>

    <rect x="886" y="325" width="78" height="62" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="925" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#991b1b">它</text>

    <rect x="1004" y="325" width="108" height="62" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <text x="1058" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">太重了</text>

    <path d="M925 320 C850 238, 620 238, 535 318" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-attn)"/>
    <text x="700" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">强关注：它 更可能指 书</text>

    <path d="M930 395 C902 468, 835 468, 800 395" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-attn)"/>
    <text x="866" y="494" text-anchor="middle" font-size="20" fill="#92400e">也会看书包，但关系较弱</text>

    <rect x="250" y="620" width="780" height="54" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="640" y="655" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">注意力不是只看距离近不近，而是判断谁和当前 Token 更有关</text>
  </g>
</svg>
