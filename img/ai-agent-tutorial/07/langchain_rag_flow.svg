<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .label{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .text{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#667085}
      .box{fill:#fff;stroke:#b8c2cc;stroke-width:2;rx:10}
      .blue{fill:#eef6ff;stroke:#4f8fd9}
      .green{fill:#eaf8f0;stroke:#46a36c}
      .orange{fill:#fff6ea;stroke:#d98a22}
      .arrow{stroke:#62748a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#62748a"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f7f9fb"/>
  <text x="40" y="50" class="title">在 LangChain 链路里接入现有 LlamaIndex 检索</text>
  <text x="40" y="82" class="text">LlamaIndex 继续负责找资料，LangChain 负责把资料、问题和提示词组织成一次模型调用。</text>

  <rect x="50" y="178" width="130" height="82" class="box"/>
  <text x="80" y="212" class="label">学生问题</text>
  <text x="82" y="238" class="small">question</text>

  <rect x="240" y="124" width="180" height="82" class="box green"/>
  <text x="285" y="158" class="label">LlamaIndex</text>
  <text x="282" y="184" class="small">检索知识库</text>

  <rect x="240" y="244" width="180" height="82" class="box blue"/>
  <text x="294" y="278" class="label">原问题</text>
  <text x="284" y="304" class="small">保留给 Prompt</text>

  <rect x="500" y="178" width="180" height="82" class="box orange"/>
  <text x="546" y="212" class="label">RAG Prompt</text>
  <text x="522" y="238" class="small">资料 + 问题 + 规则</text>

  <rect x="755" y="118" width="150" height="82" class="box"/>
  <text x="797" y="152" class="label">模型</text>
  <text x="790" y="178" class="small">生成回答</text>

  <rect x="755" y="240" width="150" height="82" class="box"/>
  <text x="790" y="274" class="label">Parser</text>
  <text x="789" y="300" class="small">输出字符串</text>

  <path d="M180 219 C210 210 214 166 240 166" class="arrow"/>
  <path d="M180 219 C210 228 214 286 240 286" class="arrow"/>
  <path d="M420 166 C462 174 474 203 500 210" class="arrow"/>
  <path d="M420 286 C462 276 474 237 500 228" class="arrow"/>
  <path d="M680 219 C718 207 726 160 755 160" class="arrow"/>
  <path d="M830 200 V240" class="arrow"/>
</svg>
