<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .label{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .text{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#667085}
      .box{fill:#fff;stroke:#b8c2cc;stroke-width:2;rx:10}
      .blue{fill:#eef6ff;stroke:#4f8fd9}
      .green{fill:#eaf8f0;stroke:#46a36c}
      .orange{fill:#fff6ea;stroke:#d98a22}
      .purple{fill:#f4efff;stroke:#8b6bd9}
      .arrow{stroke:#62748a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#62748a"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f7f9fb"/>
  <text x="40" y="50" class="title">Tool API：先声明工具，再理解 Agent 如何选择工具</text>
  <text x="40" y="82" class="text">Tool 是业务能力的说明书；Agent 才负责根据问题判断要不要用工具。</text>

  <rect x="54" y="184" width="150" height="82" class="box"/>
  <text x="84" y="218" class="label">学生问题</text>
  <text x="82" y="244" class="small">我今天上什么课</text>

  <rect x="260" y="130" width="170" height="82" class="box purple"/>
  <text x="316" y="164" class="label">@tool</text>
  <text x="286" y="190" class="small">工具名、说明、参数</text>

  <rect x="260" y="254" width="170" height="82" class="box green"/>
  <text x="300" y="288" class="label">业务函数</text>
  <text x="284" y="314" class="small">真正查询数据库/API</text>

  <rect x="520" y="184" width="170" height="82" class="box blue"/>
  <text x="568" y="218" class="label">Agent</text>
  <text x="545" y="244" class="small">选择工具并填参数</text>

  <rect x="762" y="184" width="150" height="82" class="box orange"/>
  <text x="804" y="218" class="label">回答</text>
  <text x="780" y="244" class="small">整理成自然语言</text>

  <path d="M204 225 H520" class="arrow"/>
  <path d="M430 171 C468 176 486 200 520 212" class="arrow"/>
  <path d="M605 266 C566 310 486 315 430 298" class="arrow"/>
  <path d="M690 225 H762" class="arrow"/>
  <text x="70" y="352" class="small">安全规则：studentId 来自 Java 已鉴权上下文，不要让模型自己传学生 ID。</text>
</svg>
