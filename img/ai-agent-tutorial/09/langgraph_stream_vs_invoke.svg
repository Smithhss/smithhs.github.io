<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620" role="img" aria-labelledby="title desc">
  <title id="title">invoke 和 stream 的区别</title>
  <desc id="desc">对比 invoke 一次返回最终 State，stream 按节点陆续返回中间输出。</desc>
  <rect width="1300" height="620" fill="#ffffff"/>
  <text x="55" y="58" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="31" font-weight="700" fill="#182230">invoke 看最终结果，stream 看每一步怎么变化</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei">
    <text x="105" y="125" font-size="25" font-weight="700" fill="#245aa7">invoke</text>
    <text x="105" y="162" font-size="18" fill="#536475">整张图跑完后，一次性返回最终 State</text>
    <text x="735" y="125" font-size="25" font-weight="700" fill="#147a4b">stream</text>
    <text x="735" y="162" font-size="18" fill="#536475">节点执行过程中，陆续看到每一步输出</text>
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei" text-anchor="middle">
    <rect x="90" y="210" width="180" height="78" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="180" y="258" font-size="20" font-weight="700" fill="#245aa7">clean_question</text>
    <rect x="330" y="210" width="180" height="78" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="420" y="258" font-size="20" font-weight="700" fill="#245aa7">extract_keyword</text>
    <rect x="570" y="210" width="180" height="78" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="660" y="258" font-size="20" font-weight="700" fill="#245aa7">answer</text>

    <rect x="250" y="390" width="350" height="105" rx="12" fill="#f3f7fb" stroke="#a9bdcf" stroke-width="2"/>
    <text x="425" y="432" font-size="20" font-weight="700" fill="#286274">最终 State</text>
    <text x="425" y="465" font-size="17" fill="#536475">question + cleaned_question + keyword + answer</text>

    <rect x="800" y="210" width="180" height="78" rx="10" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="890" y="258" font-size="20" font-weight="700" fill="#147a4b">clean_question</text>
    <rect x="800" y="330" width="180" height="78" rx="10" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="890" y="378" font-size="20" font-weight="700" fill="#147a4b">extract_keyword</text>
    <rect x="800" y="450" width="180" height="78" rx="10" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="890" y="498" font-size="20" font-weight="700" fill="#147a4b">answer</text>

    <rect x="1035" y="210" width="200" height="78" rx="10" fill="#f5fff9" stroke="#b3dac4" stroke-width="2"/>
    <text x="1135" y="244" font-size="17" fill="#477a60">输出 cleaned_question</text>
    <rect x="1035" y="330" width="200" height="78" rx="10" fill="#f5fff9" stroke="#b3dac4" stroke-width="2"/>
    <text x="1135" y="364" font-size="17" fill="#477a60">输出 keyword</text>
    <rect x="1035" y="450" width="200" height="78" rx="10" fill="#f5fff9" stroke="#b3dac4" stroke-width="2"/>
    <text x="1135" y="484" font-size="17" fill="#477a60">输出 answer</text>
  </g>

  <g stroke="#6f8092" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M270 249H326"/>
    <path d="M510 249H566"/>
    <path d="M660 292C640 345 580 385 517 405"/>
    <path d="M980 249H1030"/>
    <path d="M980 369H1030"/>
    <path d="M980 489H1030"/>
  </g>

  <text x="65" y="575" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="18" fill="#536475">记法：invoke 适合拿最终答案；stream 适合调试流程，也适合把节点进度展示给前端。</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6f8092"/>
    </marker>
  </defs>
</svg>
