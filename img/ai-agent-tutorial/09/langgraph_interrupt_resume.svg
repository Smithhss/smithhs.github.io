<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" role="img" aria-labelledby="title desc">
  <title id="title">Interrupt 和 Command resume</title>
  <desc id="desc">展示流程在 interrupt 暂停，人工结果通过 Command resume 回到暂停点继续执行。</desc>
  <rect width="1300" height="660" fill="#ffffff"/>
  <text x="55" y="58" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="31" font-weight="700" fill="#182230">interrupt 暂停流程，Command(resume=...) 把人工结果传回来</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei" text-anchor="middle">
    <rect x="85" y="155" width="190" height="82" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="180" y="204" font-size="20" font-weight="700" fill="#245aa7">生成 SQL</text>
    <rect x="335" y="155" width="190" height="82" rx="10" fill="#fff5df" stroke="#e4be69" stroke-width="2"/>
    <text x="430" y="204" font-size="20" font-weight="700" fill="#ad6a00">interrupt 暂停</text>
    <rect x="585" y="110" width="260" height="170" rx="14" fill="#fff9eb" stroke="#e4be69" stroke-width="2"/>
    <text x="715" y="155" font-size="22" font-weight="700" fill="#ad6a00">人工审核</text>
    <text x="715" y="195" font-size="17" fill="#775d27">approved / reason / suggestion</text>
    <text x="715" y="235" font-size="17" fill="#775d27">可以是 bool、str、dict</text>
    <rect x="905" y="155" width="260" height="82" rx="10" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="1035" y="204" font-size="20" font-weight="700" fill="#147a4b">继续执行后续节点</text>

    <rect x="365" y="410" width="570" height="115" rx="14" fill="#f3f7fb" stroke="#a9bdcf" stroke-width="2"/>
    <text x="650" y="452" font-size="21" font-weight="700" fill="#286274">graph.invoke(Command(resume=审核结果), config=config)</text>
    <text x="650" y="492" font-size="17" fill="#536475">config 里的 thread_id 找到暂停的 checkpoint</text>
  </g>

  <g stroke="#6f8092" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M275 196H330"/>
    <path d="M525 196H580"/>
    <path d="M845 196H900"/>
    <path d="M715 285V405"/>
    <path d="M935 430C1010 380 1030 305 1035 242"/>
  </g>

  <text x="65" y="600" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="18" fill="#536475">记法：resume 传什么，interrupt 那一行就收到什么；config 决定恢复哪一个暂停流程。</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6f8092"/>
    </marker>
  </defs>
</svg>
