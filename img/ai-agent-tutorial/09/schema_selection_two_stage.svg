<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">两阶段 Schema 使用方式</title><desc id="desc">先利用表目录选表，再向 SQL 生成模型提供详细 Schema。</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="55" y="58" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="30" font-weight="700" fill="#182230">Schema 不一次塞给模型：先选表，再生成 SQL</text>
  <rect x="65" y="105" width="460" height="315" rx="14" fill="#f3f8ff" stroke="#a6c5ee" stroke-width="2"/>
  <text x="95" y="148" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="24" font-weight="700" fill="#245aa7">第一阶段：表目录与选表</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei" font-size="18" fill="#334a63"><text x="95" y="192">输入：用户问题 + 指标候选 + 表简要说明</text><text x="95" y="230">目录：订单表、退款表、产品表、关联关系</text><text x="95" y="268">模型选择：需要哪些表、为什么、怎么关联</text></g>
  <rect x="105" y="304" width="370" height="74" rx="8" fill="#dfeeff"/><text x="130" y="337" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="19" fill="#245aa7">输出：order_refund → order_payment</text><text x="130" y="365" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="19" fill="#245aa7">→ order_product</text>
  <path d="M535 262H650" stroke="#6f8092" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <rect x="675" y="105" width="460" height="315" rx="14" fill="#f3fbf7" stroke="#9fcdb2" stroke-width="2"/>
  <text x="705" y="148" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="24" font-weight="700" fill="#147a4b">第二阶段：详细 Schema 与 SQL</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei" font-size="18" fill="#365c48"><text x="705" y="192">输入：已选表的完整字段、指标口径、关联路径</text><text x="705" y="230">不再提供无关表和无关字段</text><text x="705" y="268">模型生成：符合口径的 SQL</text></g>
  <rect x="715" y="304" width="370" height="74" rx="8" fill="#dff4e8"/><text x="742" y="337" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="19" fill="#147a4b">输出：SELECT ... JOIN ...</text><text x="742" y="365" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="19" fill="#147a4b">WHERE ... GROUP BY ...</text>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f8092"/></marker></defs>
</svg>
