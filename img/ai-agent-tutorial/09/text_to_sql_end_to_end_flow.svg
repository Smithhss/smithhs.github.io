<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Text-to-SQL 完整流程</title><desc id="desc">自然语言经过理解、Schema、SQL、执行和结果处理的完整流程。</desc>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="55" y="56" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="30" font-weight="700" fill="#182230">Text-to-SQL：从问题到可理解的结果</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei" text-anchor="middle">
    <rect x="55" y="155" width="160" height="92" rx="10" fill="#e8f0ff" stroke="#94b7f5"/><text x="135" y="194" font-size="20" fill="#245aa7">自然语言问题</text><text x="135" y="221" font-size="15" fill="#4c6280">业务人员提问</text>
    <rect x="260" y="155" width="160" height="92" rx="10" fill="#f4ebff" stroke="#c3a3ed"/><text x="340" y="194" font-size="20" fill="#6d3caf">查询理解</text><text x="340" y="221" font-size="15" fill="#735f8d">指标与条件</text>
    <rect x="465" y="155" width="160" height="92" rx="10" fill="#e6f8f2" stroke="#8ccdaf"/><text x="545" y="194" font-size="20" fill="#147a4b">Schema 与口径</text><text x="545" y="221" font-size="15" fill="#477a60">表、字段、关系</text>
    <rect x="670" y="155" width="160" height="92" rx="10" fill="#fff5df" stroke="#e4be69"/><text x="750" y="194" font-size="20" fill="#ad6a00">生成与校验 SQL</text><text x="750" y="221" font-size="15" fill="#85642a">只读与权限</text>
    <rect x="875" y="155" width="160" height="92" rx="10" fill="#ffecee" stroke="#e6a2ad"/><text x="955" y="194" font-size="20" fill="#b03b4c">执行查询</text><text x="955" y="221" font-size="15" fill="#81515a">数据库结果</text>
    <rect x="465" y="320" width="270" height="88" rx="10" fill="#edf4f8" stroke="#9bbbc9"/><text x="600" y="356" font-size="20" fill="#286274">结果后处理</text><text x="600" y="382" font-size="15" fill="#57747d">表格、图表、自然语言总结</text>
  </g>
  <g stroke="#6f8092" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M218 201H254"/><path d="M423 201H459"/><path d="M628 201H664"/><path d="M833 201H869"/><path d="M955 250V290H735"/></g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f8092"/></marker></defs>
</svg>
