<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">Chain、Agent 和 LangGraph 的区别</title>
  <desc id="desc">对比 Chain 的固定流程、Agent 的工具选择和 LangGraph 的流程图编排。</desc>
  <rect width="1300" height="560" fill="#ffffff"/>
  <text x="55" y="58" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="31" font-weight="700" fill="#182230">Chain、Agent、LangGraph 解决的是不同层次的问题</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei">
    <rect x="65" y="110" width="350" height="360" rx="12" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="240" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#245aa7">Chain</text>
    <text x="240" y="184" text-anchor="middle" font-size="17" fill="#4c6280">固定步骤，按顺序执行</text>

    <rect x="115" y="230" width="250" height="54" rx="9" fill="#ffffff" stroke="#94b7f5"/>
    <text x="240" y="264" text-anchor="middle" font-size="18" fill="#245aa7">Prompt</text>
    <rect x="115" y="320" width="250" height="54" rx="9" fill="#ffffff" stroke="#94b7f5"/>
    <text x="240" y="354" text-anchor="middle" font-size="18" fill="#245aa7">Model</text>
    <rect x="115" y="410" width="250" height="54" rx="9" fill="#ffffff" stroke="#94b7f5"/>
    <text x="240" y="444" text-anchor="middle" font-size="18" fill="#245aa7">Parser</text>

    <rect x="475" y="110" width="350" height="360" rx="12" fill="#f4ebff" stroke="#c3a3ed" stroke-width="2"/>
    <text x="650" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#6d3caf">Agent</text>
    <text x="650" y="184" text-anchor="middle" font-size="17" fill="#705d87">模型判断要不要调用工具</text>

    <rect x="575" y="230" width="150" height="54" rx="9" fill="#ffffff" stroke="#c3a3ed"/>
    <text x="650" y="264" text-anchor="middle" font-size="18" fill="#6d3caf">模型判断</text>
    <rect x="515" y="350" width="125" height="54" rx="9" fill="#ffffff" stroke="#c3a3ed"/>
    <text x="577" y="384" text-anchor="middle" font-size="17" fill="#6d3caf">查课表</text>
    <rect x="660" y="350" width="125" height="54" rx="9" fill="#ffffff" stroke="#c3a3ed"/>
    <text x="722" y="384" text-anchor="middle" font-size="17" fill="#6d3caf">查资料</text>

    <rect x="885" y="110" width="350" height="360" rx="12" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="1060" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#147a4b">LangGraph</text>
    <text x="1060" y="184" text-anchor="middle" font-size="17" fill="#477a60">程序画好流程图，按条件流转</text>

    <rect x="940" y="220" width="120" height="50" rx="9" fill="#ffffff" stroke="#8ccdaf"/>
    <text x="1000" y="252" text-anchor="middle" font-size="17" fill="#147a4b">Router</text>
    <rect x="1085" y="220" width="120" height="50" rx="9" fill="#ffffff" stroke="#8ccdaf"/>
    <text x="1145" y="252" text-anchor="middle" font-size="17" fill="#147a4b">普通回答</text>
    <rect x="940" y="320" width="120" height="50" rx="9" fill="#ffffff" stroke="#8ccdaf"/>
    <text x="1000" y="352" text-anchor="middle" font-size="17" fill="#147a4b">生成 SQL</text>
    <rect x="1085" y="320" width="120" height="50" rx="9" fill="#ffffff" stroke="#8ccdaf"/>
    <text x="1145" y="352" text-anchor="middle" font-size="17" fill="#147a4b">安全校验</text>
    <rect x="1010" y="420" width="120" height="50" rx="9" fill="#ffffff" stroke="#8ccdaf"/>
    <text x="1070" y="452" text-anchor="middle" font-size="17" fill="#147a4b">执行查询</text>
  </g>

  <g stroke="#6f8092" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M240 287V314"/>
    <path d="M240 377V404"/>
    <path d="M650 287V337"/>
    <path d="M650 287C620 312 600 328 585 343"/>
    <path d="M650 287C681 312 700 328 715 343"/>
    <path d="M1064 245H1079"/>
    <path d="M1000 273V314"/>
    <path d="M1064 345H1079"/>
    <path d="M1145 373C1134 396 1105 413 1076 417"/>
  </g>

  <text x="65" y="520" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="18" fill="#536475">记法：Chain 管固定顺序，Agent 管工具选择，LangGraph 管复杂流程里的节点、分支和状态。</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6f8092"/>
    </marker>
  </defs>
</svg>
