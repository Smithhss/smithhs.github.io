<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Time Travel 回看和分叉</title>
  <desc id="desc">展示从历史 checkpoint 找到 generate_sql 之前的状态，update_state 创建新分叉，再从分叉继续执行。</desc>
  <rect width="1300" height="720" fill="#ffffff"/>
  <text x="55" y="58" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="31" font-weight="700" fill="#182230">Time Travel：找到中间 checkpoint，改一点 State，再继续往后跑</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei" text-anchor="middle">
    <rect x="80" y="135" width="180" height="78" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="170" y="183" font-size="20" font-weight="700" fill="#245aa7">make_plan</text>
    <rect x="340" y="135" width="220" height="78" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="450" y="183" font-size="20" font-weight="700" fill="#245aa7">generate_sql</text>
    <rect x="640" y="135" width="180" height="78" rx="10" fill="#e8f0ff" stroke="#94b7f5" stroke-width="2"/>
    <text x="730" y="183" font-size="20" font-weight="700" fill="#245aa7">answer</text>

    <rect x="275" y="290" width="350" height="100" rx="12" fill="#fff5df" stroke="#e4be69" stroke-width="2"/>
    <text x="450" y="328" font-size="20" font-weight="700" fill="#ad6a00">before_generate_sql checkpoint</text>
    <text x="450" y="365" font-size="17" fill="#775d27">next = ("generate_sql",)</text>

    <rect x="300" y="485" width="300" height="90" rx="12" fill="#f3f7fb" stroke="#a9bdcf" stroke-width="2"/>
    <text x="450" y="522" font-size="19" font-weight="700" fill="#286274">update_state</text>
    <text x="450" y="555" font-size="17" fill="#536475">plan 改成 统计订单数量</text>

    <rect x="790" y="485" width="300" height="90" rx="12" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="940" y="522" font-size="19" font-weight="700" fill="#147a4b">新分叉 checkpoint</text>
    <text x="940" y="555" font-size="17" fill="#477a60">fork_config 指向这里</text>

    <rect x="1045" y="135" width="190" height="78" rx="10" fill="#e6f8f2" stroke="#8ccdaf" stroke-width="2"/>
    <text x="1140" y="183" font-size="20" font-weight="700" fill="#147a4b">重新生成结果</text>
  </g>

  <g stroke="#6f8092" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 174H335"/>
    <path d="M560 174H635"/>
    <path d="M450 218V285"/>
    <path d="M450 392V480"/>
    <path d="M600 530H785"/>
    <path d="M940 480C930 360 1015 245 1088 202"/>
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei" font-size="17" fill="#536475">
    <text x="90" y="650">1. get_state_history 看到历史快照</text>
    <text x="395" y="650">2. 找到 next 是 generate_sql 的快照</text>
    <text x="725" y="650">3. update_state 创建分叉 checkpoint</text>
    <text x="1030" y="650">4. invoke(None, fork_config) 从分叉继续跑</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6f8092"/>
    </marker>
  </defs>
</svg>
