<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">企业级 Text-to-SQL 请求处理流水线</title><desc id="desc">Router、RAG、查询规划、澄清和 SQL 生成的流程。</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="55" y="56" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="30" font-weight="700" fill="#182230">请求进入 Text-to-SQL 后，如何一步步变成查询计划</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei" font-size="19" text-anchor="middle">
    <rect x="75" y="115" width="170" height="66" rx="9" fill="#e8f0ff" stroke="#94b7f5"/><text x="160" y="156" fill="#245aa7">用户问题</text>
    <rect x="310" y="115" width="180" height="66" rx="9" fill="#f4ebff" stroke="#c3a3ed"/><text x="400" y="156" fill="#6d3caf">Router 分类</text>
    <rect x="555" y="115" width="220" height="66" rx="9" fill="#e6f8f2" stroke="#8ccdaf"/><text x="665" y="156" fill="#147a4b">RAG：指标 + Schema</text>
    <rect x="840" y="115" width="250" height="66" rx="9" fill="#fff5df" stroke="#e4be69"/><text x="965" y="156" fill="#ad6a00">查询规划：选指标和表</text>
    <rect x="840" y="270" width="250" height="66" rx="9" fill="#ffecee" stroke="#e6a2ad"/><text x="965" y="311" fill="#b03b4c">信息不足：澄清对话</text>
    <rect x="475" y="430" width="300" height="76" rx="9" fill="#edf4f8" stroke="#9bbbc9"/><text x="625" y="463" fill="#286274">已选指标 + 详细 Schema</text><text x="625" y="488" font-size="15" fill="#57747d">进入 SQL 生成</text>
  </g>
  <g stroke="#6f8092" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M248 148H304"/><path d="M493 148H549"/><path d="M778 148H834"/><path d="M965 184V264"/><path d="M965 338V390H780"/><path d="M780 410H628V424"/></g>
  <text x="110" y="565" font-family="Arial, PingFang SC, Microsoft YaHei" font-size="17" fill="#536475">Router 只判断走哪条能力链路；指标、表和条件由查询规划模块决定。</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f8092"/></marker></defs>
</svg>
