<svg width="1180" height="650" viewBox="0 0 1180 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">为什么不直接用 Milvus</title>
  <desc id="desc">对比 Milvus 负责的向量数据库能力和 LlamaIndex VectorStoreIndex 组织的完整 RAG 问答流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .milvus { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; }
      .llama { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; }
      .step { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .prompt { fill: #fdf2f8; stroke: #db2777; stroke-width: 2.5; }
      .label { font: 800 21px sans-serif; fill: #111827; }
      .small { font: 500 15px sans-serif; fill: #475569; }
      .caption { font: 800 24px sans-serif; fill: #0f172a; }
      .note { font: 700 18px sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="650"/>
  <text x="590" y="48" text-anchor="middle" class="title">为什么不直接用 Milvus</text>
  <text x="590" y="80" text-anchor="middle" class="subtitle">Milvus 负责向量数据库能力，LlamaIndex 负责把完整 RAG 问答流程组织起来</text>

  <rect class="panel" x="55" y="120" width="500" height="420" rx="8"/>
  <text x="305" y="158" text-anchor="middle" class="caption">Milvus 擅长做什么</text>

  <rect class="milvus" x="105" y="205" width="170" height="60" rx="8"/>
  <text x="190" y="231" text-anchor="middle" class="label">保存向量</text>
  <text x="190" y="252" text-anchor="middle" class="small">embedding</text>

  <rect class="milvus" x="335" y="205" width="170" height="60" rx="8"/>
  <text x="420" y="231" text-anchor="middle" class="label">保存字段</text>
  <text x="420" y="252" text-anchor="middle" class="small">content / metadata</text>

  <rect class="milvus" x="105" y="330" width="170" height="60" rx="8"/>
  <text x="190" y="356" text-anchor="middle" class="label">相似度检索</text>
  <text x="190" y="377" text-anchor="middle" class="small">top-k search</text>

  <rect class="milvus" x="335" y="330" width="170" height="60" rx="8"/>
  <text x="420" y="356" text-anchor="middle" class="label">返回相似数据</text>
  <text x="420" y="377" text-anchor="middle" class="small">相似 Node 候选</text>

  <path class="line" d="M275 235 H325"/>
  <path class="line" d="M420 265 V320"/>
  <path class="line" d="M335 360 H285"/>

  <text x="305" y="463" text-anchor="middle" class="note">它是很强的向量数据库</text>
  <text x="305" y="493" text-anchor="middle" class="small">但不会自动完成完整问答流程</text>

  <rect class="panel" x="625" y="120" width="500" height="420" rx="8"/>
  <text x="875" y="158" text-anchor="middle" class="caption">完整 RAG 还需要什么</text>

  <rect class="step" x="675" y="190" width="135" height="48" rx="8"/>
  <text x="742" y="220" text-anchor="middle" class="label">读取资料</text>

  <rect class="step" x="850" y="190" width="135" height="48" rx="8"/>
  <text x="917" y="220" text-anchor="middle" class="label">切分资料</text>

  <rect class="step" x="675" y="265" width="135" height="48" rx="8"/>
  <text x="742" y="295" text-anchor="middle" class="label">生成向量</text>

  <rect class="step" x="850" y="265" width="135" height="48" rx="8"/>
  <text x="917" y="295" text-anchor="middle" class="label">保存 metadata</text>

  <rect class="step" x="675" y="340" width="135" height="48" rx="8"/>
  <text x="742" y="370" text-anchor="middle" class="label">拿回 Node</text>

  <rect class="prompt" x="850" y="340" width="135" height="48" rx="8"/>
  <text x="917" y="370" text-anchor="middle" class="label">拼 Prompt</text>

  <rect class="prompt" x="760" y="420" width="180" height="58" rx="8"/>
  <text x="850" y="445" text-anchor="middle" class="label">调用大模型</text>
  <text x="850" y="466" text-anchor="middle" class="small">生成最终回答</text>

  <path class="line" d="M810 214 H840"/>
  <path class="line" d="M917 238 V255"/>
  <path class="line" d="M850 289 H820"/>
  <path class="line" d="M742 313 V330"/>
  <path class="line" d="M810 364 H840"/>
  <path class="line" d="M917 388 C910 405 895 415 875 420"/>

  <text x="875" y="512" text-anchor="middle" class="note">这些上层流程由 LlamaIndex 组织</text>

  <rect class="llama" x="390" y="565" width="400" height="50" rx="8"/>
  <text x="590" y="596" text-anchor="middle" class="label">VectorStoreIndex = 组织 RAG 查询流程的结构</text>

  <path class="soft" d="M420 390 C470 500 500 550 550 565"/>
  <path class="soft" d="M850 478 C780 530 720 550 650 565"/>
</svg>
