<svg width="1180" height="620" viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LlamaIndex 的 Index 是干什么的</title>
  <desc id="desc">说明 LlamaIndex 的 Index 像资料目录和查询组织者，把资料片段、向量、向量库和查询入口串起来。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .doc { fill: #eef2ff; stroke: #6366f1; stroke-width: 2.5; }
      .node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .index { fill: #ecfdf5; stroke: #10b981; stroke-width: 3; }
      .store { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; }
      .query { fill: #fdf2f8; stroke: #db2777; stroke-width: 2.5; }
      .label { font: 800 21px sans-serif; fill: #111827; }
      .small { font: 500 15px sans-serif; fill: #475569; }
      .tiny { font: 500 14px sans-serif; fill: #64748b; }
      .caption { font: 700 18px sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="620"/>
  <text x="590" y="48" text-anchor="middle" class="title">LlamaIndex 的 Index 是干什么的</text>
  <text x="590" y="80" text-anchor="middle" class="subtitle">它不是向量本身，也不是 Milvus 底层索引，而是把资料组织成“能被查询”的结构</text>

  <rect class="box" x="55" y="120" width="250" height="375" rx="8"/>
  <text x="180" y="158" text-anchor="middle" class="caption">没有 Index 时</text>
  <rect class="doc" x="95" y="195" width="170" height="58" rx="8"/>
  <text x="180" y="219" text-anchor="middle" class="label">资料 A</text>
  <text x="180" y="240" text-anchor="middle" class="small">课程讲义</text>
  <rect class="doc" x="95" y="275" width="170" height="58" rx="8"/>
  <text x="180" y="299" text-anchor="middle" class="label">资料 B</text>
  <text x="180" y="320" text-anchor="middle" class="small">项目文档</text>
  <rect class="doc" x="95" y="355" width="170" height="58" rx="8"/>
  <text x="180" y="379" text-anchor="middle" class="label">资料 C</text>
  <text x="180" y="400" text-anchor="middle" class="small">制度说明</text>
  <text x="180" y="455" text-anchor="middle" class="small">资料是散的</text>
  <text x="180" y="478" text-anchor="middle" class="small">系统不知道怎么查</text>

  <rect class="box" x="365" y="120" width="450" height="375" rx="8"/>
  <text x="590" y="158" text-anchor="middle" class="caption">构建 VectorStoreIndex 时</text>

  <rect class="node" x="405" y="205" width="135" height="54" rx="8"/>
  <text x="472" y="238" text-anchor="middle" class="label">Node</text>
  <rect class="node" x="405" y="285" width="135" height="54" rx="8"/>
  <text x="472" y="318" text-anchor="middle" class="label">Node</text>
  <rect class="node" x="405" y="365" width="135" height="54" rx="8"/>
  <text x="472" y="398" text-anchor="middle" class="label">Node</text>

  <rect class="index" x="590" y="230" width="185" height="150" rx="10"/>
  <text x="682" y="266" text-anchor="middle" class="label">VectorStoreIndex</text>
  <text x="682" y="294" text-anchor="middle" class="small">记录这些资料</text>
  <text x="682" y="318" text-anchor="middle" class="small">怎么被检索</text>
  <text x="682" y="342" text-anchor="middle" class="small">怎么接向量库</text>

  <path class="line" d="M540 232 H580"/>
  <path class="line" d="M540 312 H580"/>
  <path class="line" d="M540 392 C570 392 575 365 590 348"/>

  <text x="590" y="455" text-anchor="middle" class="small">Index 像“资料目录 + 查询组织者”</text>

  <rect class="box" x="875" y="120" width="250" height="375" rx="8"/>
  <text x="1000" y="158" text-anchor="middle" class="caption">查询时</text>
  <rect class="query" x="915" y="205" width="170" height="58" rx="8"/>
  <text x="1000" y="229" text-anchor="middle" class="label">用户问题</text>
  <text x="1000" y="250" text-anchor="middle" class="small">第三天讲什么</text>
  <rect class="store" x="915" y="305" width="170" height="58" rx="8"/>
  <text x="1000" y="329" text-anchor="middle" class="label">Milvus</text>
  <text x="1000" y="350" text-anchor="middle" class="small">查相似向量</text>
  <rect class="query" x="915" y="405" width="170" height="58" rx="8"/>
  <text x="1000" y="429" text-anchor="middle" class="label">QueryEngine</text>
  <text x="1000" y="450" text-anchor="middle" class="small">组织最终回答</text>

  <path class="soft" d="M775 285 C835 250 860 235 905 234"/>
  <path class="soft" d="M775 324 C835 345 860 335 905 334"/>
  <path class="line" d="M1000 263 V295"/>
  <path class="line" d="M1000 363 V395"/>

  <rect x="210" y="535" width="760" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="590" y="568" text-anchor="middle" class="label">一句话：Index 负责把资料整理成能被检索、能被问答使用的结构</text>
</svg>
