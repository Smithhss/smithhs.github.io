<svg width="1180" height="660" viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LlamaIndex 核心概念关系图</title>
  <desc id="desc">展示 Document、Node、Index、VectorStore、Retriever 和 QueryEngine 在 LlamaIndex 知识库问答流程中的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px sans-serif; fill: #475569; }
      .stage { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .doc { fill: #eef2ff; stroke: #6366f1; stroke-width: 2.5; }
      .node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .index { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; }
      .store { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; }
      .query { fill: #fdf2f8; stroke: #db2777; stroke-width: 2.5; }
      .llm { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; }
      .label { font: 800 21px sans-serif; fill: #111827; }
      .small { font: 500 15px sans-serif; fill: #475569; }
      .caption { font: 700 18px sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="660"/>
  <text x="590" y="48" text-anchor="middle" class="title">LlamaIndex 核心概念关系图</text>
  <text x="590" y="80" text-anchor="middle" class="subtitle">先认识这些对象，再看代码会更容易知道每一步在做什么</text>

  <rect class="stage" x="60" y="120" width="1060" height="190" rx="8"/>
  <text x="90" y="154" class="caption">资料入库阶段</text>

  <rect class="doc" x="100" y="190" width="170" height="74" rx="8"/>
  <text x="185" y="218" text-anchor="middle" class="label">Document</text>
  <text x="185" y="242" text-anchor="middle" class="small">读取后的原始资料</text>

  <rect class="node" x="350" y="170" width="160" height="54" rx="8"/>
  <text x="430" y="202" text-anchor="middle" class="label">Node 1</text>
  <rect class="node" x="350" y="235" width="160" height="54" rx="8"/>
  <text x="430" y="267" text-anchor="middle" class="label">Node 2</text>
  <text x="430" y="315" text-anchor="middle" class="small">Document 被切分成多个片段</text>

  <rect class="index" x="610" y="190" width="190" height="74" rx="8"/>
  <text x="705" y="218" text-anchor="middle" class="label">Index</text>
  <text x="705" y="242" text-anchor="middle" class="small">对资料建立查询结构</text>

  <rect class="store" x="890" y="190" width="170" height="74" rx="8"/>
  <text x="975" y="218" text-anchor="middle" class="label">VectorStore</text>
  <text x="975" y="242" text-anchor="middle" class="small">保存向量和文本</text>

  <path class="line" d="M270 227 H340"/>
  <path class="line" d="M510 198 C550 198 565 210 600 220"/>
  <path class="line" d="M510 262 C550 262 565 244 600 234"/>
  <path class="line" d="M800 227 H880"/>

  <rect class="stage" x="60" y="360" width="1060" height="190" rx="8"/>
  <text x="90" y="394" class="caption">用户提问阶段</text>

  <rect class="llm" x="100" y="430" width="170" height="74" rx="8"/>
  <text x="185" y="458" text-anchor="middle" class="label">用户问题</text>
  <text x="185" y="482" text-anchor="middle" class="small">例如：RAG 是什么</text>

  <rect class="query" x="350" y="430" width="180" height="74" rx="8"/>
  <text x="440" y="458" text-anchor="middle" class="label">QueryEngine</text>
  <text x="440" y="482" text-anchor="middle" class="small">问答入口</text>

  <rect class="index" x="610" y="430" width="180" height="74" rx="8"/>
  <text x="700" y="458" text-anchor="middle" class="label">Retriever</text>
  <text x="700" y="482" text-anchor="middle" class="small">从索引中找资料</text>

  <rect class="store" x="890" y="430" width="170" height="74" rx="8"/>
  <text x="975" y="458" text-anchor="middle" class="label">VectorStore</text>
  <text x="975" y="482" text-anchor="middle" class="small">返回相似 Node</text>

  <path class="line" d="M270 467 H340"/>
  <path class="line" d="M530 467 H600"/>
  <path class="line" d="M790 467 H880"/>
  <path class="soft-line" d="M890 500 C760 590 495 590 455 515"/>

  <rect class="llm" x="475" y="575" width="230" height="54" rx="8"/>
  <text x="590" y="608" text-anchor="middle" class="label">大模型生成最终回答</text>

  <path class="soft-line" d="M440 504 C455 550 500 570 560 575"/>

  <path class="dashed" d="M975 264 V420"/>
  <text x="1015" y="343" text-anchor="middle" class="small">同一个向量库</text>
</svg>
