      .db{fill:#fff7e8;stroke:#d99b36;stroke-width:2;rx:10}
      .text{font:600 20px Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .small{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#4b5563}
      .arrow{stroke:#2f5d8c;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .lane{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#6b7280}
