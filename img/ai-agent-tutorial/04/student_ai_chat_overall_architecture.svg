<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8c"/>
    </marker>
    <style>
      .title{font:700 30px Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .box{fill:#ffffff;stroke:#2f5d8c;stroke-width:2;rx:10}
