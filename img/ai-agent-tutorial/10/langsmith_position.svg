<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LangSmith 在 AI 应用里的位置</title>
  <desc id="desc">展示用户请求经过 Java、Python、LangChain、LangGraph 后，LangSmith 负责记录 Trace 和调试信息。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 32px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .box{fill:#eef4ff;stroke:#3b82f6;stroke-width:2}
      .java{fill:#ecfdf5;stroke:#22c55e;stroke-width:2}
      .python{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
      .smith{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}
      .text{font:700 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937;text-anchor:middle}
      .small{font:15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}
      .line{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8b5cf6;stroke-width:2.2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfdff"/>
  <text x="60" y="58" class="title">LangSmith：不是业务流程的一步，而是 AI 调试观测平台</text>
  <text x="60" y="88" class="sub">它记录每次模型调用、Prompt、输入输出、耗时、错误和嵌套步骤，帮助我们看清 AI 链路里发生了什么。</text>

  <rect class="box" x="80" y="200" width="170" height="90" rx="12"/>
  <text x="165" y="238" class="text">用户 / 前端</text>
  <text x="165" y="265" class="small">提出问题</text>

  <rect class="java" x="330" y="200" width="190" height="90" rx="12"/>
  <text x="425" y="238" class="text">Java 后端</text>
  <text x="425" y="265" class="small">鉴权 / 转发 / 执行</text>

  <rect class="python" x="600" y="170" width="250" height="150" rx="12"/>
  <text x="725" y="210" class="text">Python AI 服务</text>
  <text x="725" y="240" class="small">LangChain 链</text>
  <text x="725" y="268" class="small">LangGraph 节点</text>
  <text x="725" y="296" class="small">模型 / 工具 / RAG</text>

  <rect class="box" x="930" y="200" width="180" height="90" rx="12"/>
  <text x="1020" y="238" class="text">大模型服务</text>
  <text x="1020" y="265" class="small">百炼兼容接口</text>

  <rect class="smith" x="505" y="455" width="460" height="135" rx="16"/>
  <text x="735" y="497" class="text">LangSmith</text>
  <text x="735" y="530" class="small">记录 Trace：Prompt、模型输入输出、耗时、错误、子步骤</text>
  <text x="735" y="558" class="small">用于调试、复盘、评估和线上观测</text>

  <path class="line" d="M250 245 H320"/>
  <path class="line" d="M520 245 H590"/>
  <path class="line" d="M850 245 H920"/>
  <path class="line" d="M930 270 C870 360 780 378 735 455"/>

  <path class="dash" d="M725 320 V445"/>
  <text x="840" y="390" class="small">发送 Trace 数据</text>
</svg>
