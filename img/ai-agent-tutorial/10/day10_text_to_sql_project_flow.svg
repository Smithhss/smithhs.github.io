<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Text-to-SQL 项目落地主流程</title>
  <desc id="desc">从用户问题到问题分类、指标检索、表目录、选表、表详情、SQL 判断生成、Java 执行和结果分析的完整链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .title{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5c6b7c}
      .box{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .safe{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .warn{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .end{fill:#f3efff;stroke:#7a5bc8;stroke-width:2}
      .text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fbfcff"/>
  <text x="60" y="58" class="title">当前代码主线：LangGraph 编排 Text-to-SQL 的可控链路</text>
  <text x="60" y="88" class="sub">Python 负责分类、检索、选表、生成和分析；Java 负责内部只读执行、LIMIT 和查询超时。</text>
  <g transform="translate(70,135)">
    <rect class="box" x="0" y="0" width="170" height="72" rx="10"/><text class="text" x="85" y="33">用户问题</text><text class="small" x="85" y="56">自然语言输入</text>
    <rect class="warn" x="215" y="0" width="170" height="72" rx="10"/><text class="text" x="300" y="33">问题分类</text><text class="small" x="300" y="56">查询 / 修改 / 问答</text>
    <rect class="box" x="430" y="0" width="170" height="72" rx="10"/><text class="text" x="515" y="33">检索指标</text><text class="small" x="515" y="56">订单总量 / 退款率</text>
    <rect class="box" x="645" y="0" width="170" height="72" rx="10"/><text class="text" x="730" y="33">加载表目录</text><text class="small" x="730" y="56">table_catalog.json</text>
    <rect class="box" x="860" y="0" width="170" height="72" rx="10"/><text class="text" x="945" y="33">Router 选表</text><text class="small" x="945" y="56">缩小候选范围</text>
    <path class="line" d="M170,36 H205"/><path class="line" d="M385,36 H420"/><path class="line" d="M600,36 H635"/><path class="line" d="M815,36 H850"/>
  </g>
  <g transform="translate(140,305)">
    <rect class="box" x="0" y="0" width="190" height="78" rx="10"/><text class="text" x="95" y="34">加载表详情</text><text class="small" x="95" y="58">metadata/tables/*.json</text>
    <rect class="warn" x="250" y="0" width="190" height="78" rx="10"/><text class="text" x="345" y="34">SQL 判断生成</text><text class="small" x="345" y="58">judge_and_generate_sql</text>
    <rect class="warn" x="500" y="0" width="190" height="78" rx="10"/><text class="text" x="595" y="34">条件分支</text><text class="small" x="595" y="58">generate / need_*</text>
    <rect class="box" x="750" y="0" width="190" height="78" rx="10"/><text class="text" x="845" y="34">execute_sql</text><text class="small" x="845" y="58">调 Java 内部接口</text>
    <path class="line" d="M190,39 H240"/><path class="line" d="M440,39 H490"/><path class="line" d="M690,39 H740"/>
  </g>
  <g transform="translate(210,495)">
    <rect class="safe" x="0" y="0" width="190" height="78" rx="10"/><text class="text" x="95" y="33">Java 校验</text><text class="small" x="95" y="58">SELECT / 表 / LIMIT</text>
    <rect class="safe" x="260" y="0" width="190" height="78" rx="10"/><text class="text" x="355" y="33">JdbcTemplate</text><text class="small" x="355" y="58">返回 columns / rows</text>
    <rect class="warn" x="520" y="0" width="190" height="78" rx="10"/><text class="text" x="615" y="33">有限修正</text><text class="small" x="615" y="58">BadSqlGrammarException</text>
    <rect class="end" x="780" y="0" width="190" height="78" rx="10"/><text class="text" x="875" y="33">结果分析</text><text class="small" x="875" y="58">summary + chart</text>
    <path class="line" d="M190,39 H250"/><path class="line" d="M450,39 H510"/><path class="line" d="M710,39 H770"/>
  </g>
  <path class="line" d="M1015,207 C1080,207 1080,344 1080,344 H1085"/>
  <path class="line" d="M985,383 C1050,383 1050,534 400,534"/>
  <text x="928" y="655" class="sub">最终交付给用户的是数据答案、表格或图表，不是裸 SQL。</text>
</svg>
