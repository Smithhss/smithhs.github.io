<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Router 选表和详细 Schema</title>
  <desc id="desc">先用表摘要缩小候选表范围，再查询被选中表的详细字段、枚举、索引和关联关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#26364a"/></marker>
    <style>
      .title{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .table{fill:#eef4ff;stroke:#3867b7;stroke-width:2}
      .selected{fill:#ecfdf3;stroke:#2b8a55;stroke-width:2}
      .detail{fill:#fff7e8;stroke:#d18b22;stroke-width:2}
      .text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2d3d;text-anchor:middle}
      .small{font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526173;text-anchor:middle}
      .line{stroke:#26364a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfcff"/>
  <text x="60" y="58" class="title">Router 选表：先缩小范围，再查详细结构</text>
  <rect class="table" x="80" y="135" width="230" height="78" rx="10"/><text class="text" x="195" y="168">order_payment</text><text class="small" x="195" y="192">订单支付表摘要</text>
  <rect class="table" x="80" y="245" width="230" height="78" rx="10"/><text class="text" x="195" y="278">refund_order</text><text class="small" x="195" y="302">退款订单表摘要</text>
  <rect class="table" x="80" y="355" width="230" height="78" rx="10"/><text class="text" x="195" y="388">order_product</text><text class="small" x="195" y="412">课程产品表摘要</text>
  <rect class="table" x="80" y="465" width="230" height="78" rx="10"/><text class="text" x="195" y="498">student</text><text class="small" x="195" y="522">学生信息表摘要</text>
  <rect class="detail" x="485" y="280" width="250" height="100" rx="12"/><text class="text" x="610" y="318">Router 选表</text><text class="small" x="610" y="346">根据问题和表摘要</text><text class="small" x="610" y="368">选择真正相关的表</text>
  <path class="line" d="M310,174 C390,190 430,250 480,305"/>
  <path class="line" d="M310,284 H475"/>
  <path class="line" d="M310,394 C385,385 425,360 475,342"/>
  <path class="line" d="M310,504 C390,475 430,405 480,360"/>
  <rect class="selected" x="900" y="180" width="275" height="86" rx="10"/><text class="text" x="1038" y="215">选中：order_payment</text><text class="small" x="1038" y="240">订单数量、金额、状态查询</text>
  <rect class="selected" x="900" y="310" width="275" height="86" rx="10"/><text class="text" x="1038" y="345">选中：refund_order</text><text class="small" x="1038" y="370">退款率、退款金额查询</text>
  <path class="line" d="M735,320 C795,285 835,235 890,225"/>
  <path class="line" d="M735,342 C795,352 835,353 890,353"/>
  <rect class="detail" x="500" y="530" width="530" height="92" rx="12"/>
  <text class="text" x="765" y="566">查询已选择表的详细结构</text>
  <text class="small" x="765" y="596">字段类型、枚举、可查询字段、敏感字段、索引、表关联</text>
  <path class="line" d="M1038,396 C1038,485 930,525 880,530"/>
</svg>
